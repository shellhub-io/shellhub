version: "2"

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true

issues:
  uniq-by-line: true

formatters:
  enable:
    - gofumpt
    - goimports
    # goimports keeps whatever grouping it is handed, so an import added in its own
    # block stays there and reads as a deliberate section. gci decides the grouping.
    - gci
  settings:
    gci:
      sections:
        - standard
        - default

linters:
  exclusions:
    paths:
      - "mocks/.*\\.go$"
      # npm ships Go sources inside ui/node_modules. CI never installs them for the
      # Go jobs, so only a local run sees the package — and lints a vendor's code.
      - "node_modules/"
    rules:
      - path: _test\.go$
        linters:
          - unparam
  enable:
    - errcheck
    - revive
    - govet
    - ineffassign
    - copyloopvar
    - staticcheck
    - unconvert
    - unused
    - misspell
    - modernize
    - whitespace
    - depguard
    - nlreturn
    - nilerr
    - gosec
    # Resource leaks and silent truncation.
    - sqlclosecheck
    - rowserrcheck
    # Constructs that compile but cannot mean what they say.
    - durationcheck
    - asasalint
    - makezero
    - nilnesserr
    - wastedassign
    - reassign
    - predeclared
    - recvcheck
    - fatcontext
    - nosprintfhostport
    - musttag
    - iotamixing
    - unqueryvet
    # Naming and idiom the codebase already follows.
    - perfsprint
    - usetesting
    - errname
    - intrange
    # Error identity survives wrapping: errors.Is/As over == and type assertions.
    - errorlint
    - forcetypeassert
    # I/O that a cancelled request should not outlive.
    - noctx
    - errchkjson
    # A response body left open holds its connection out of the pool.
    - bodyclose
    # A switch over an enum with no default silently ignores a value added later.
    - exhaustive
    - gocritic
    # A nolint that no longer suppresses anything, or is written so it never did.
    - nolintlint
    # Time that is compared must come from the mockable clock.
    - forbidigo
    # Tests that fail for the reason they claim, and report the caller's line.
    - testifylint
    - thelper
    - usestdlibvars
    - mirror
    - exptostd
    - tparallel
    - unparam

  settings:
    forbidigo:
      forbid:
        # forbidigo's own defaults, restated because naming any pattern replaces them.
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
        - pattern: ^time\.Now$
          msg: use clock.Now() so a test can control it. If this is an elapsed-time
            measurement or a deadline, keep time.Now and add //nolint:forbidigo saying which.
        - pattern: ^(clock|uuid|osauth)\.DefaultBackend$
          msg: a swapped backend outlives the test that set it. Use clock.Freeze, clock.Set,
            uuid.Fix, uuid.Set or osauth.Set, which put the previous one back when the test ends.
        - pattern: ^envs\.DefaultBackend$
          msg: read a variable with envs.Get. A swapped backend outlives the test that set it,
            so swap it with envs.Set or envstest.SetEdition, which put the previous one back.
        - pattern: ^hash\.Backend$
          msg: a swapped hasher outlives the test that set it. Use hash.Set, which puts the
            previous one back when the test ends.
    exhaustive:
      # A default case is the codebase's way of saying the rest are deliberately ignored.
      # Without this the linter demands every one of Stripe's 200-odd event types be listed.
      default-signifies-exhaustive: true
    gosec:
      excludes:
        # G104 (errors unhandled) duplicates errcheck, which reports the same call
        # with a better message and honours the //nolint:errcheck convention.
        - G104
    revive:
      severity: warning
      rules:
        # A doc comment on an exported symbol is one of the two comments code-style.md
        # leaves, and this is the rule that asks for it. Enabled for every module: the
        # policy has the linter as its only source of doc comments, so a module the rule
        # skips is a module with no documentation requirement at all.
        # disableStutteringCheck keeps the rule on the comment: a package-stuttering name
        # is a rename, which is a different change with different reviewers.
        - name: exported
          arguments:
            - disableStutteringCheck
    staticcheck:
      checks: ["all", "-SA1029", "-ST1020", "-ST1021", "-ST1022", "-ST1000", "-QF1008"]
    depguard:
      rules:
        all:
          deny:
            - pkg: io/ioutil
              desc: 'io/ioutil package has been deprecated'
            - pkg: github.com/google/uuid
              desc: "Uuid generation is only allowed using 'github.com/shellhub-io/shellhub/pkg/uuid'"
            - pkg: github.com/dgrijalva/jwt-go
              desc: "dgrijalva/jwt-go is deprecated please use 'github.com/golang-jwt/jwt'"
            - pkg: math/rand
              desc: "math/rand is predictable; use 'crypto/rand'"
            - pkg: crypto/md5
              desc: 'MD5 is broken; use crypto/sha256 or stronger'
            - pkg: crypto/sha1
              desc: 'SHA-1 is broken; use crypto/sha256 or stronger'
            - pkg: crypto/des
              desc: 'DES is broken; use crypto/aes'
            - pkg: crypto/rc4
              desc: 'RC4 is broken; use crypto/aes'
            - pkg: crypto/dsa
              desc: 'DSA is deprecated; use crypto/ed25519 or crypto/ecdsa'
        production:
          files:
            - "$all"
            - "!$test"
            - "!**/*test/**"
            - "!**/tests/**"
          deny:
            - pkg: testing
              desc: "only _test.go files and *test helper packages import testing; a file that needs it is a test and must end in _test.go"
    whitespace:
      multi-if: true
      multi-func: true
    govet:
      disable:
        - composites
