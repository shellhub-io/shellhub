version: "2"

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true

issues:
  uniq-by-line: true

formatters:
  enable:
    - gofumpt
    - goimports
    # goimports keeps whatever grouping it is handed, so an import added in its own
    # block stays there and reads as a deliberate section. gci decides the grouping.
    - gci
  settings:
    gci:
      sections:
        - standard
        - default

linters:
  exclusions:
    paths:
      - "mocks/.*\\.go$"
      # npm ships Go sources inside ui/node_modules. CI never installs them for the
      # Go jobs, so only a local run sees the package — and lints a vendor's code.
      - "node_modules/"
  enable:
    - errcheck
    - revive
    - govet
    - ineffassign
    - copyloopvar
    - staticcheck
    - unconvert
    - unused
    - misspell
    - modernize
    - whitespace
    - depguard
    - nlreturn
    - nilerr
    - gosec
    # Resource leaks and silent truncation.
    - sqlclosecheck
    - rowserrcheck
    # Constructs that compile but cannot mean what they say.
    - durationcheck
    - asasalint
    - makezero
    - nilnesserr
    - wastedassign
    - reassign
    - predeclared
    - recvcheck
    - fatcontext
    - nosprintfhostport
    - musttag
    - iotamixing
    - unqueryvet
    # Naming and idiom the codebase already follows.
    - perfsprint
    - usetesting
    - errname
    - intrange
    # Error identity survives wrapping: errors.Is/As over == and type assertions.
    - errorlint
    - forcetypeassert
    # Tests that fail for the reason they claim, and report the caller's line.
    - testifylint
    - thelper
    - usestdlibvars
    - mirror
    - exptostd
    - tparallel

  settings:
    gosec:
      excludes:
        # G104 (errors unhandled) is redundant with the disabled errcheck policy.
        - G104
    revive:
      severity: warning
    staticcheck:
      checks: ["all", "-SA1029", "-ST1020", "-ST1021", "-ST1022", "-ST1000", "-QF1008"]
    depguard:
      rules:
        all:
          deny:
            - pkg: io/ioutil
              desc: 'io/ioutil package has been deprecated'
            - pkg: github.com/google/uuid
              desc: "Uuid generation is only allowed using 'github.com/shellhub-io/shellhub/pkg/uuid'"
            - pkg: github.com/dgrijalva/jwt-go
              desc: "dgrijalva/jwt-go is deprecated please use 'github.com/golang-jwt/jwt'"
    whitespace:
      multi-if: true
      multi-func: true
    govet:
      disable:
        - composites
