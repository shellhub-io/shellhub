services:
  server:
    build:
      cache_to:
        - type=registry,ref=${SHELLHUB_E2E_LAYER_CACHE:?}:cache-server-${SHELLHUB_BUILD_EDITION:-community},mode=max
  gateway:
    build:
      cache_to:
        - type=registry,ref=${SHELLHUB_E2E_LAYER_CACHE:?}:cache-gateway,mode=max
  ui:
    build:
      cache_to:
        - type=registry,ref=${SHELLHUB_E2E_LAYER_CACHE:?}:cache-ui,mode=max
