version: "3.7"

services:
  server:
    image: server:test
    pull_policy: never
    restart: on-failure:3
    healthcheck:
      interval: 5s
      start_period: 10s
      retries: 20
    ports: []
  gateway:
    image: gateway:test
    pull_policy: never
    restart: on-failure:3
    healthcheck:
      interval: 5s
      start_period: 10s
      retries: 20
    ports: []
  ui:
    image: ui:test
    pull_policy: never
    restart: on-failure:3
    healthcheck:
      interval: 5s
      start_period: 10s
      retries: 20
