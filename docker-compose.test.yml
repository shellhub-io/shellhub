version: "3.7"

x-e2e-labels: &e2e-labels
  io.shellhub.e2e.run: ${SHELLHUB_E2E_RUN:?}
  io.shellhub.e2e.lease: ${SHELLHUB_E2E_LEASE:-}

services:
  server:
    image: shellhub-e2e/server:${SHELLHUB_E2E_RUN:?}-${SHELLHUB_BUILD_EDITION:-community}
    labels: *e2e-labels
    pull_policy: never
    restart: on-failure:3
    healthcheck:
      interval: 5s
      start_period: 10s
      retries: 20
    ports: []
    environment:
      - SHELLHUB_OPENAPI_VALIDATION=strict
      - SHELLHUB_OPENAPI_SCHEMA=file:///etc/shellhub/openapi.json
      - SHELLHUB_LOG_FORMAT=text
    volumes:
      - ./openapi/static/openapi-${SHELLHUB_EDITION:-community}.json:/etc/shellhub/openapi.json:ro
  gateway:
    image: shellhub-e2e/gateway:${SHELLHUB_E2E_RUN:?}
    labels: *e2e-labels
    pull_policy: never
    restart: on-failure:3
    healthcheck:
      interval: 5s
      start_period: 10s
      retries: 20
    ports: []
  ui:
    image: shellhub-e2e/ui:${SHELLHUB_E2E_RUN:?}
    labels: *e2e-labels
    pull_policy: never
    restart: on-failure:3
    healthcheck:
      interval: 5s
      start_period: 10s
      retries: 20
  redis:
    labels: *e2e-labels
