{{ $cfg := .Config }}

limit_req_zone $binary_remote_addr zone=api_limit:{{ $cfg.APIRateLimitZoneSize }} rate={{ $cfg.APIRateLimit }};
# Dedicated tight limit for the pairing endpoints: guards a short pairing-code
# guess against brute-force, well below the global api_limit. These are one-shot
# user actions, so 30 req/min per IP is generous for humans and hostile to a
# guesser.
limit_req_zone $binary_remote_addr zone=pairing_limit:1m rate=30r/m;
limit_req_status 429;

{{ $api_burst := "" }}
{{ if $cfg.APIBurstSize }}
    {{ $api_burst = printf "burst=%s" $cfg.APIBurstSize }}
{{ end }}

{{ $api_delay := "nodelay" }}
{{ if ne $cfg.APIBurstDelay "nodelay" }}
    {{ $api_delay = printf "delay=%s" $cfg.APIBurstDelay }}
{{ end }}

server {
    {{ if and ($cfg.EnableAutoSSL) (ne $cfg.Env "development") -}}
    listen 443 reuseport ssl{{ if $cfg.EnableProxyProtocol }} proxy_protocol{{ end }} backlog={{ $cfg.BacklogSize }};
    ssl_certificate /etc/letsencrypt/live/{{ $cfg.Domain }}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{ $cfg.Domain }}/privkey.pem;

    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ssl_dhparam /etc/shellhub-gateway/dhparam.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    {{ else -}}
    listen 80 reuseport{{ if $cfg.EnableProxyProtocol }} proxy_protocol{{ end }} backlog={{ $cfg.BacklogSize }};
    {{- end }}
    {{ if $cfg.EnableProxyProtocol }}
    # Both families: ::/0 alone leaves $remote_addr as the load balancer's own
    # address for an IPv4 peer, which silently keys every rate limit zone and
    # every access log line on the balancer instead of the client.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header proxy_protocol;
    {{ end }}
    server_name {{ $cfg.Domain }};
    server_tokens off;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Forwarded to every upstream. Declared once here rather than per location:
    # nginx replaces the whole proxy_set_header list when a location declares any
    # entry of its own, so no location below may set one.
    #
    # No identity headers are forwarded. The API authenticates in-process and
    # overwrites the whole X-ID/X-Role/X-Tenant-ID/X-Username/X-Admin/X-Device-UID
    # set from the request's own credential, so a forged one cannot survive and
    # this proxy has nothing to strip.
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $x_forwarded_port;
    proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    {{ if $cfg.EnableProxyProtocol -}}
    proxy_set_header X-Real-IP $proxy_protocol_addr;
    {{ else -}}
    proxy_set_header X-Real-IP $x_real_ip;
    {{ end -}}
    proxy_http_version 1.1;

    {{ if eq $cfg.Database "migrate" }}

    location /healthcheck {
        default_type text/plain;
        return 200 "OK";
    }

    location = / {
        return 302 /migrate.html;
    }

    location /api/migration/ {
        set $upstream {{ $cfg.APIBackend }};

        proxy_pass http://$upstream;
    }

    location / {
        set $upstream ui:8080;

        add_header Cache-Control "no-cache, no-store";
        add_header Pragma "no-cache";

        proxy_pass http://$upstream;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    {{ else }}

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /etc/letsencrypt;
    }

    # Nothing is served under /internal anymore. Refuse it here rather than
    # letting it fall through to the console, so a route added there later is
    # never reachable from outside by accident.
    location /internal {
        return 404;
    }

    # Accepting or minting a pairing code enrolls a device, which makes them the
    # endpoints worth throttling against a code brute-force. Declared as a regex
    # so it takes precedence over the /api prefix below, and covering the
    # /api/containers alias because the API's rewrite to /api/devices happens
    # behind this proxy.
    location ~ ^/api/(devices|containers)/pairing/(prepare|[A-Za-z0-9-]+/accept)$ {
        set $upstream {{ $cfg.APIBackend }};
        limit_req zone=pairing_limit burst=5 nodelay;

        proxy_pass http://$upstream;
    }

    location /api {
        set $upstream {{ $cfg.APIBackend }};
        limit_req zone=api_limit{{ if $api_burst }} {{ $api_burst }}{{ end }} {{ $api_delay }};

        proxy_pass http://$upstream;
    }

    {{ if $cfg.EnableEnterprise -}}
    location /admin/api {
        set $upstream {{ $cfg.APIBackend }};

        proxy_pass http://$upstream;
    }
    {{ end -}}

    location ^~ /mcp {
        set $upstream {{ $cfg.APIBackend }};
        limit_req zone=api_limit{{ if $api_burst }} {{ $api_burst }}{{ end }} {{ $api_delay }};

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://$upstream;
    }

    # Long-lived connections: the agent transports, and the browser terminal's
    # WebSocket. The timeouts are why these are not folded into /api.
    location /ssh/ {
        set $upstream {{ $cfg.APIBackend }};

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_socket_keepalive on;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
        proxy_pass http://$upstream;
    }

    location /agent/ {
        set $upstream {{ $cfg.APIBackend }};

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_socket_keepalive on;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
        proxy_pass http://$upstream;
    }

    location /ws {
        set $upstream {{ $cfg.APIBackend }};

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_socket_keepalive on;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
        proxy_pass http://$upstream;
    }

    # These three are published at the root of the domain and answered under
    # /api. The API resolves them itself, so they are routed here and nothing
    # more -- the mapping belongs with the routes, not with whatever happens to
    # sit in front of them.
    location /healthcheck {
        set $upstream {{ $cfg.APIBackend }};
        limit_req zone=api_limit{{ if $api_burst }} {{ $api_burst }}{{ end }} {{ $api_delay }};

        proxy_pass http://$upstream;
    }

    location /info {
        set $upstream {{ $cfg.APIBackend }};
        limit_req zone=api_limit{{ if $api_burst }} {{ $api_burst }}{{ end }} {{ $api_delay }};

        proxy_pass http://$upstream;
    }

    location ~ ^/(install.sh|kickstart.sh)$ {
        set $upstream {{ $cfg.APIBackend }};
        limit_req zone=api_limit{{ if $api_burst }} {{ $api_burst }}{{ end }} {{ $api_delay }};

        # The script embeds request-derived defaults (SERVER_ADDRESS from the
        # forwarded host), so it must never be cached: a shared cache would serve
        # one requester's address to everyone.
        add_header Cache-Control "no-store";
        proxy_pass http://$upstream;
    }

    {{ if eq $cfg.Env "development" -}}
    location /openapi {
        set $upstream openapi:8080;

        proxy_pass http://$upstream;
    }

    location /openapi/mock {
        set $upstream openapi:8080;

        rewrite ^/openapi/mock/?(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /openapi/proxy {
        set $upstream openapi:8080;

        rewrite ^/openapi/proxy/?(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
    {{- end }}

    location /v1/ {
        return 301 /;
    }

    location ~ ^/admin$ {
        rewrite ^/admin/?$ /admin/ permanent;
    }

    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        set $upstream ui:8080;

        add_header Cache-Control "no-cache, no-store";
        add_header Pragma "no-cache";

        proxy_pass http://$upstream;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    {{ end }}
}

{{ if eq $cfg.Env "development" }}
# Dev-only: route the marketing website and docs sites by subdomain. The console
# keeps the apex domain via the catch-all above; website.<domain> and
# docs.<domain> proxy to their dev servers running inside the ui container.
server {
    listen 80;
    server_name website.{{ $cfg.Domain }};
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream ui:8082;

        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    server_name docs.{{ $cfg.Domain }};
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream ui:8083;

        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Test SAML IdP (SimpleSAMLphp) for local SSO development. Served at idp.<domain>
# so it advertises a browser-reachable entity id and SSO URL under the same apex.
server {
    listen 80;
    server_name idp.{{ $cfg.Domain }};
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream saml-idp:8080;

        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
{{ end }}

{{ if and (ne $cfg.Database "migrate") $cfg.EnableEnterprise $cfg.WebEndpoints -}}
{{ $DOMAIN := or $cfg.WebEndpointsDomain $cfg.Domain }}
server {
    {{ if and ($cfg.EnableAutoSSL) (ne $cfg.Env "development") -}}
    listen 443;
    ssl_certificate "/etc/letsencrypt/live/*.{{ $DOMAIN }}/fullchain.pem";
    ssl_certificate_key "/etc/letsencrypt/live/*.{{ $DOMAIN }}/privkey.pem";

    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ssl_dhparam /etc/shellhub-gateway/dhparam.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    {{ else -}}
    listen 80;
    {{- end }}

    server_name "~^[a-f0-9]{32}\.{{ $DOMAIN }}$";
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The address is the subdomain, and the API reads it off the Host. Passing
    # the hostname is the whole contract: it used to be decomposed here into
    # X-Address and X-Path, which meant this file had to know both the shape of
    # an address and the route that serves one.
    #
    # $request_uri, because the path belongs to the device's own HTTP server and
    # is not ours to normalize: proxy_pass through a variable would otherwise
    # rebuild it from $uri, and an escaped separator would reach the device as a
    # real one, asking it for a resource nobody asked for.
    location / {
        set $upstream {{ $cfg.APIBackend }};

        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;

        proxy_pass http://$upstream$request_uri;
    }
}
{{ end }}

{{ if and (ne $cfg.Database "migrate") ($cfg.EnableAutoSSL) (ne $cfg.Env "development") }}
server {
    listen 80 default_server{{ if $cfg.EnableProxyProtocol }} proxy_protocol{{ end }};

    return 308 https://$host$request_uri;
}
{{- end }}
