post:
  operationId: requestResetMFA
  summary: Request Reset MFA
  description: |
    Email one code to the account's sign-in address and another to its recovery
    address. Both are needed to reset MFA. A new pair is valid for a day; while
    one is pending, a request emails it again with its original expiry instead
    of replacing it. A pair cancelled by three misses makes the next new pair
    wait 1 minute, then 4, 16 and 60 for each further cancellation, until a day
    passes without one; a request during the wait answers `200` and sends
    nothing.

    It answers `200` with a token whether or not the identifier names an account
    that can reset MFA, and sends the codes only when it does. The same
    identifier can ask once a minute; asking again sooner answers `429`. An
    account asked for within the last minute under another identifier also gets
    `200` and a token for it, but the server sends nothing and the earlier pair
    stays valid.
  tags:
    - cloud
    - mfa
    - users
  security: []
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            identifier:
              description: The same as the login identifier; can be either the user's email or username.
              type: string
              maxLength: 320
              example: john_doe
          required:
            - identifier
  responses:
    '200':
      description: The request was accepted.
      content:
        application/json:
          schema:
            type: object
            properties:
              token:
                description: |
                  Opaque token identifying this reset request. Present it in the
                  `user-id` path segment of `PUT /api/user/mfa/reset/{user-id}`
                  to complete the reset.
                type: string
                example: 4a5f6b3e-1234-4a12-9abc-1234567890ab
            required:
              - token
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '429':
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: ../components/schemas/apiError.yaml
    '500':
      $ref: ../components/responses/500.yaml
