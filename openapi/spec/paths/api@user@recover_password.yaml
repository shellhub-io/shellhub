post:
  operationId: recoverPassword
  summary: Recover password
  description: |
    Email the account a link to set a new password, replacing the link of any earlier request.

    It answers `200` alike for an unknown and a real account, and sends only for a real one. The
    same identifier can ask once a minute; asking again sooner answers `429`. An account asked for
    within the last minute under another identifier, its username after its email or the reverse,
    also answers `200` but sends nothing and keeps the earlier link.
  tags:
    - cloud

    - users
  security: []
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            username:
              oneOf:
                - $ref: ../components/schemas/userUsername.yaml
                - $ref: ../components/schemas/userEmail.yaml
          required:
            - username
  responses:
    '200':
      description: The request was accepted.
    '401':
      $ref: ../components/responses/401.yaml
    '429':
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: ../components/schemas/apiError.yaml
    '500':
      $ref: ../components/responses/500.yaml
