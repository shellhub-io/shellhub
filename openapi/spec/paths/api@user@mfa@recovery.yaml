post:
  operationId: mfaRecover
  summary: Recover MFA
  description: |
    Complete a sign-in with one of the user's recovery codes in place of the
    TOTP code `authMFA` takes. Like `authMFA`, it is called after the password
    step of `authUser`, with the `X-MFA-Token` that step returned, and the
    token signs in once only. The recovery code is invalidated for future uses.
    An unknown, expired or already used token answers `401`, and so does a
    code sent while the account is locked out by wrong codes, which recovery
    codes count toward like TOTP codes.

    The recovery code will be cached for 10 minutes. During this period, the
    user can use the same recovery code to disable their MFA without needing to
    provide two separate codes. The `X-Expires-At` header specifies the epoch
    value marking the end of the cache period.
  tags:
    - cloud
    - mfa
    - users
  security: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/mfaRecover.yaml
  responses:
    '200':
      description: Success recover account's access.
      headers:
        X-Expires-At:
          description: The epoch time at which the recovery code will become invalid.
          schema:
            type: string
            minimum: 0
      content:
        application/json:
          schema:
            $ref: ../components/schemas/userAuth.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '500':
      $ref: ../components/responses/500.yaml
