parameters:
  - $ref: ../components/parameters/path/deviceUIDPath.yaml
get:
  operationId: getDevice
  summary: Get a device
  description: Get a device.
  tags:
    - community
    - devices
  security:
    - jwt: []
    - api-key: []
  responses:
    '200':
      description: Success get a device.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/device.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '500':
      $ref: ../components/responses/500.yaml
delete:
  operationId: deleteDevice
  summary: Delete a device
  description: Delete a device.
  tags:
    - community
    - devices
  security:
    - jwt: []
    - api-key: []
  responses:
    '200':
      description: Success to delete a device.
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '500':
      $ref: ../components/responses/500.yaml
put:
  operationId: updateDevice
  summary: Rename a device
  description: |
    Change a device's name. The name is part of the SSHID clients connect by, so a
    rename changes the address of every future connection to this device.
  tags:
    - community
    - devices
  security:
    - jwt: []
    - api-key: []
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              $ref: ../components/schemas/deviceName.yaml
  responses:
    '200':
      description: Success to rename the device.
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '500':
      $ref: ../components/responses/500.yaml
patch:
  operationId: renameDevice
  summary: Rename a device
  description: '**Deprecated**: Use `PUT /api/devices/{uid}` instead.'
  deprecated: true
  tags:
    - community
    - devices
  security:
    - jwt: []
    - api-key: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              $ref: ../components/schemas/deviceName.yaml
          required:
            - name
  responses:
    '200':
      description: Success to rename the device.
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '500':
      $ref: ../components/responses/500.yaml
