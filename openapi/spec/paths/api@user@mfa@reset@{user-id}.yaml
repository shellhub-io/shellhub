put:
  operationId: resetMFA
  summary: Reset MFA
  description: |
    Similar to the `disableMFA` operation, this endpoint uses the two codes sent
    by `requestResetMFA` instead of a TOTP or recovery code. The `user-id` path
    segment accepts either the opaque token returned by `requestResetMFA` (the
    in-app flow) or the raw user ID carried by the emailed reset link.

    The reset revokes every token the user holds and signs no one in: the
    user signs in afterwards with the password alone.

    While the server checks a guess, it refuses another guess for the same user
    if the two share the sign-in code or the recovery code. A guess with
    both codes wrong never blocks a pair with a right code. A pair with one
    right code and one wrong counts as a miss, and the third miss cancels the
    codes, so the user requests a new pair. A pair with both codes wrong counts
    nothing. Wrong codes, a token that names no account and a refused
    concurrent guess all answer `403`.
  tags:
    - cloud
    - mfa
    - users
  security: []
  parameters:
    - in: path
      name: user-id
      required: true
      schema:
        type: string
        description: |
          Either the opaque token returned by `requestResetMFA` (in-app flow) or
          the raw user ID from the emailed reset link. The server resolves a token
          to its user; anything else is treated as a raw user ID.
        example: 4a5f6b3e-1234-4a12-9abc-1234567890ab
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/mfaReset.yaml
  responses:
    '200':
      description: Success to reset the MFA.
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '500':
      $ref: ../components/responses/500.yaml
