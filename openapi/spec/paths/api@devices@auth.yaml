post:
  operationId: authDevice
  summary: Auth device
  description: |
    Authenticate a ShellHub agent into the ShellHub server.

    Every 30 seconds, this route is hit by ShellHub agent to inform device availability.
  tags:
    - internal
    - devices
  security:
    - jwt: []
    - api-key: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/deviceAuthRequest.yaml
  responses:
    '200':
      description: Success to auth device.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/deviceAuthResponse.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '500':
      $ref: ../components/responses/500.yaml
