post:
  operationId: linkSamlAccount
  summary: Link an existing account to the SAML identity
  description: |
    Confirms the link a first SAML sign-in left waiting when its email matched
    an account not yet bound to an Identity Provider subject. The assertion
    consumer service does not sign that sign-in in: it redirects to
    `/login?sso=link`, where the user signs in to the existing account with its
    own password and second factor. This endpoint then binds the account the
    session belongs to the subject, once.

    The link is kept for ten minutes, only for the account whose email matched,
    and only for the browser that started the sign-in, named by its
    `__Host-shellhub_saml_browser` cookie over HTTPS or its
    `shellhub_saml_browser` cookie otherwise. Linking expires the cookie.

    Requires an active JWT session; API keys are rejected.

    To access this endpoint, SAML authentication must be enabled and the
    instance must be running the Enterprise edition. If not, the endpoint
    returns a `501 Not Implemented` status code.
  security:
    - jwt: []
  tags:
    - cloud
    - users
  responses:
    '200':
      description: The account is bound to the SAML identity
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '501':
      description: SAML authentication is not enabled or instance is not running Enterprise edition
    '503':
      $ref: ../components/responses/503.yaml
