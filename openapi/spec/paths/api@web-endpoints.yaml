get:
  operationId: listWebEndpoints
  summary: List web endpoints
  description: List web endpoints.
  tags:
    - cloud
    - web-endpoints
  parameters:
    - in: query
      name: filter
      description: |
        Web endpoint's filter

        Filter field receives a base64url-encoded JSON object (URL-safe, unpadded) to limit the search. Standard base64 is also accepted for backward compatibility.

        Accepted property names and operators:

        - `address`: `contains`, `eq`, `ne`
        - `host`: `contains`, `eq`, `ne`
        - `device_id`: `eq`, `ne`, matching the device's `uid`

        Any other property or operator returns `400` with `filter property is not valid`. To list a device's web endpoints by its name, look up its `uid` through `GET /api/devices` first.

        The example decodes to
        `[{"type":"property","params":{"name":"device_id","operator":"eq","value":"13b0c8ea878e61ff849db69461795006a9594c8f6a6390ce0000100b0c9d7d0a"}}]`.
      schema:
        type: string
        pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
        example: W3sidHlwZSI6InByb3BlcnR5IiwicGFyYW1zIjp7Im5hbWUiOiJkZXZpY2VfaWQiLCJvcGVyYXRvciI6ImVxIiwidmFsdWUiOiIxM2IwYzhlYTg3OGU2MWZmODQ5ZGI2OTQ2MTc5NTAwNmE5NTk0YzhmNmE2MzkwY2UwMDAwMTAwYjBjOWQ3ZDBhIn19XQ==
    - $ref: ../components/parameters/query/pageQuery.yaml
    - $ref: ../components/parameters/query/perPageQuery.yaml
    - $ref: ../components/parameters/query/sortByQuery.yaml
    - $ref: ../components/parameters/query/orderByQuery.yaml
  security:
    - jwt: []
    - api-key: []
  responses:
    '200':
      description: Success to get the web-endpoints.
      headers:
        X-Total-Count:
          $ref: ../components/headers/XTotalCount.yaml
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/webendpoint.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
post:
  operationId: createWebEndpoint
  summary: Create a web endpoint
  description: Create a web endpoint for a device.
  tags:
    - cloud
    - web-endpoints
  security:
    - jwt: []
    - api-key: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            uid:
              $ref: ../components/schemas/deviceUID.yaml
            host:
              $ref: ../components/schemas/webendpointHost.yaml
            port:
              $ref: ../components/schemas/webendpointPort.yaml
            ttl:
              $ref: ../components/schemas/webendpointTTL.yaml
            tls:
              $ref: ../components/schemas/webendpointTLS.yaml
          required:
            - uid
            - host
            - port
            - ttl
  responses:
    '200':
      description: Web-endpoint created successfully.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/webendpoint.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
