patch:
  operationId: updateUser
  summary: Update user
  tags:
    - community
    - users
  security:
    - jwt: []
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            username:
              type: string
            email:
              description: |
                Changing it requires `current_password`. On Cloud the new
                address takes effect only after its owner opens the
                confirmation link mailed to it; until then the account keeps
                the old one, and the request still answers 200.
              type: string
            recovery_email:
              description: |
                A recovery email serves as the user's final recourse to regain
                access to their account. It cannot be the same as the user's
                primary email. Once defined, it cannot be updated to an empty
                value. Changing it requires `current_password`.
              type: string
            password:
              description: |
                The new password. Changing it signs out every session the user holds, including
                the one making this request.
              type: string
            current_password:
              description: |
                The user's current password. It's required when changing the
                password, the email or the recovery email, so an account that
                signs in only through SSO cannot change them here.
              type: string
  responses:
    '200':
      $ref: ../components/responses/200.yaml
    '400':
      description: |
        The request is invalid. On Cloud, a new `email` or `recovery_email`
        whose domain is a known disposable-email domain answers with that field
        set to `disposable`, and one whose domain cannot receive mail with
        `unreachable`.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/apiError.yaml
          example:
            message: bad request
            fields:
              recovery_email: disposable
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '500':
      $ref: ../components/responses/500.yaml
