get:
  operationId: getSamlAuthUrl
  summary: Get SAML authentication URL
  description: |
    Retrieves the URL that starts a sign-in at the Identity Provider (IdP).
    After successful authentication, users are automatically redirected to the ShellHub dashboard.

    Under the HTTP-Redirect binding, the URL is the IdP's own, carrying the
    request in its query. Under the HTTP-POST binding, it is the path of
    `/api/user/saml/request` on ShellHub, whose page posts the request to the
    IdP.

    To access this endpoint, SAML authentication must be enabled and the
    instance must be running the Enterprise edition. If not, the endpoint
    returns a `501 Not Implemented` status code.
  tags:
    - cloud
    - users
  security: []
  responses:
    '200':
      description: Successfully retrieved the SAML authentication URL
      content:
        application/json:
          schema:
            type: object
            required:
              - url
            properties:
              url:
                type: string
                description: |
                  The Identity Provider's login URL under the HTTP-Redirect binding, or the
                  `/api/user/saml/request` path, relative to ShellHub's origin, under the
                  HTTP-POST binding
                example: 'https://login.microsoftonline.com/tenant-id/saml2?SAMLRequest=encoded-request'
    '400':
      $ref: '../components/responses/400.yaml'
    '500':
      $ref: '../components/responses/500.yaml'
    '503':
      $ref: ../components/responses/503.yaml
    '501':
      description: SAML authentication is not enabled or instance is not running Enterprise edition
post:
  operationId: authSamlUser
  summary: Receive a SAML assertion
  description: |
    The assertion consumer service. The Identity Provider posts the user's signed
    assertion here through the browser.

    Without a `RelayState`, it signs the user in and redirects to `/login` with the
    session token, or with the attributes the assertion is missing. With a
    `RelayState`, it answers a re-authentication started at
    `/api/user/saml/reauth` and redirects to `/sso-reauth` with `status=ok` and
    the confirmation code that approves the SSH login, or with `status=error`.
  tags:
    - cloud
    - users
  security: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          required:
            - SAMLResponse
          properties:
            SAMLResponse:
              type: string
              description: The base64-encoded SAML response from the Identity Provider
            RelayState:
              type: string
              description: The re-authentication token, when the assertion answers a re-authentication
  responses:
    '301':
      description: Redirects the browser back to the console
      headers:
        Location:
          schema:
            type: string
    '500':
      $ref: '../components/responses/500.yaml'
    '503':
      $ref: ../components/responses/503.yaml
    '501':
      description: SAML authentication is not enabled or instance is not running Enterprise edition
