post:
  operationId: closeSession
  summary: Close session
  description: Close a session.
  security:
    - jwt: []
    - api-key: []
  tags:
    - community
    - sessions
  parameters:
    - $ref: ../components/parameters/path/sessionUIDPath.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            device:
              $ref: ../components/schemas/deviceUID.yaml
          required:
            - device
  responses:
    '200':
      description: The session is closed. No gateway was still holding it, so it was retired on the spot.
    '202':
      description: >-
        The close request reached the device. A gateway still holds this session. It closes the
        client's connection within five seconds of the device ending it and then deactivates the
        session, so the session may show as active until then.
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      description: No gateway holds the session and it is not in the caller's namespace, so nothing was closed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/apiError.yaml
    '500':
      $ref: ../components/responses/500.yaml
