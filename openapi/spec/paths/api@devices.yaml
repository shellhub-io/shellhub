get:
  operationId: getDevices
  summary: List devices
  description: |-
    List devices.

    **Filtering by owner.** The `owner_id` field takes the ID of a member with the
    `eq` operator and matches the devices that member paired. A value that is not a
    UUID is a bad request.

    **Filtering by key verification.** The `key_verified` field takes a boolean
    with the `bool` or `eq` operator and matches the devices whose agent has, or
    has never, signed a server challenge with its device key.

    **Filtering by position.** The `latitude` and `longitude` fields take a
    number with the `gt` or `lt` operator and match the devices whose GeoIP
    position lies past it. Joining the four bounds with `and` reads the devices
    inside an area, such as a point of `GET /api/devices/locations`. A device
    with no position is kept at 0,0, so add the `located` field, a boolean with
    the `bool` or `eq` operator, to leave those out of an area around that point.

    **Deprecated filter field names.** The `filter` parameter still accepts the
    legacy Mongo-style field names `info.platform` and `identity.mac`, which are
    duplicates of `platform` and `mac` respectively. These aliases are kept for
    backward compatibility and will be removed in the next major API version.
    Update integrations to use the flat names (`platform`, `mac`).

    **Cursor mode.** Sending `page[size]` or `page[after]` reads the devices in
    creation order, oldest first, instead of by page number. A full read returns
    every device that existed when it started exactly once, even while devices
    change. Follow the `Link` header, or send `X-Next-Cursor` back as
    `page[after]`, until a response carries neither: that is the only signal the
    read is complete, since a page may hold fewer devices than `page[size]` and
    still have a next one. Cursor mode responses leave out `X-Total-Count`.
    Combining cursor mode with `page`, `per_page`, `sort_by` or `order_by` is a
    bad request.
  tags:
    - community
    - devices
  security:
    - jwt: []
    - api-key: []
  parameters:
    - $ref: ../components/parameters/query/filterQuery.yaml
    - $ref: ../components/parameters/query/pageQuery.yaml
    - $ref: ../components/parameters/query/perPageQuery.yaml
    - $ref: ../components/parameters/query/pageSizeQuery.yaml
    - $ref: ../components/parameters/query/pageAfterQuery.yaml
    - name: status
      description: Device's status. Omit it to list devices of every status.
      schema:
        $ref: ../components/schemas/deviceStatus.yaml
      required: false
      in: query
    - name: sort_by
      description: Device's property to sort of
      schema:
        type: string
        example: name
        default: last_seen
      required: false
      in: query
    - name: order_by
      schema:
        description: Device's list order
        type: string
        enum:
          - asc
          - desc
        example: asc
        default: desc
      required: false
      in: query
  responses:
    '200':
      description: Success to get a list of devices.
      headers:
        X-Total-Count:
          $ref: ../components/headers/XTotalCount.yaml
        Link:
          $ref: ../components/headers/Link.yaml
        X-Next-Cursor:
          $ref: ../components/headers/XNextCursor.yaml
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/device.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '500':
      $ref: ../components/responses/500.yaml
