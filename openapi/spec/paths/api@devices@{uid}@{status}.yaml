patch:
  operationId: updateDeviceStatus
  summary: Update a device's status
  description: Update a device's status.
  tags:
    - community
    - devices
  security:
    - jwt: []
    - api-key: []
  parameters:
    - $ref: ../components/parameters/path/deviceUIDPath.yaml
    - name: status
      description: Device's status
      schema:
        $ref: ../components/schemas/deviceStatusAction.yaml
      required: true
      in: path
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            replace:
              description: |
                On an accept, confirm that it replaces an offline accepted device in
                the namespace that reports the same identity.
              type: boolean
              default: false
  responses:
    '200':
      description: Success to update device status.
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '402':
      $ref: ../components/responses/402.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '500':
      $ref: ../components/responses/500.yaml
