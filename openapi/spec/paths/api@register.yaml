post:
  operationId: registerUser
  summary: Register a new user
  tags:
    - community
    - users
  security: []
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: John Doe
              description: The full name of the user.
            email:
              type: string
              example: john.doe@test.com
              description: |
                The user's email address, which must be unique. This email will
                be used for login and for receiving important notifications,
                such as password reset emails. If `email_marketing` is set to
                `true`, promotional emails will also be sent to this address.
            username:
              type: string
              example: john_doe
              description: |
                The username, which must be unique across the system. Users can
                log in using either their username or email.
            password:
              type: string
              format: ^([a-zA-Z0-9_-]){1,64}$
              example: mS@aZ%n267M@3&k!H46^#78s!@$F4^@7
              description: |
                The password for the user account. Must follow the regex.
            email_marketing:
              type: boolean
              example: true
              description: |
                Indicates whether the user opts to receive marketing and
                promotional emails.
            sig:
              type: string
              example: ''
              description: |
                **For standard registration processes, this field should be
                ignored.** 

                The invite code from an invitation link. It completes the
                invited account and joins the invitation's namespace. It does
                not confirm the email: on Cloud the account still waits for the
                emailed confirmation code.
            device_code:
              type: string
              pattern: '^[2-9A-HJKMNP-TV-Za-hjkmnp-tv-z-]+$'
              example: WXYZ2K7Q
              description: |
                The pairing code of a device waiting to be accepted, when the
                registration started from an accept-device link. On Cloud the
                confirmation email's link carries it, so confirming the email
                on any device leads back to accepting this one.
          required:
            - name
            - email
            - username
            - password
            - email_marketing
  responses:
    '200':
      description: |
        Invitation-based registration on an edition without email
        confirmation (Community, and Enterprise when an administrator sent
        the invitation). Returns session credentials so the client can log
        in immediately.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/userAuth.yaml
    '204':
      description: |
        Registration completed, but the account cannot sign in yet: on
        Cloud it waits for the emailed confirmation code, and on Enterprise an
        account a non-administrator invited waits for an administrator's
        approval.
    '400':
      description: |
        The request is invalid. On Cloud, an open sign-up whose email domain is
        a known disposable-email domain answers with `fields.email` set to
        `disposable`, and one whose domain cannot receive mail with
        `unreachable`.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/apiError.yaml
          example:
            message: bad request
            fields:
              email: disposable
    '401':
      $ref: ../components/responses/401.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '500':
      $ref: ../components/responses/500.yaml
