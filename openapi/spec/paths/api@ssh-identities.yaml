get:
  operationId: listSshIdentities
  summary: List SSH identities
  description: |
    List the enrolled SSH keys the caller may see in the current namespace.

    The collection is filtered by what the caller is allowed to see: a member
    receives their own enrolled keys, and a caller holding the
    `SSHIdentityManage` permission receives every member's, their own included,
    which is what offboarding needs. The scope is not a parameter, so the same
    request returns different rows depending on the caller's permissions.
  tags:
    - community
    - ssh-identities
  security:
    - jwt: []
  responses:
    '200':
      description: Success to list SSH identities.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/sshIdentity.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '500':
      $ref: ../components/responses/500.yaml
post:
  operationId: createSshIdentity
  summary: Enroll an SSH identity
  description: |
    Enroll an SSH public key as an identity in the current namespace, bound to
    the caller. Requires the `SSHIdentityAdd` permission.
  tags:
    - community
    - ssh-identities
  security:
    - jwt: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/sshIdentityRequest.yaml
  responses:
    '200':
      description: Success to enroll an SSH identity.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/sshIdentity.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '500':
      $ref: ../components/responses/500.yaml
