post:
  operationId: confirmSshApproval
  summary: Confirm an SSH login approval
  description: |
    Confirm a pending `identity` approval for your account. The response carries
    a confirmation code; once it is typed at the terminal the login is waiting
    at, the gateway binds the presented key to your account and releases the
    login. Confirming alone binds nothing: if the code is never typed, the
    approval lapses with its window and the key stays unknown.

    A key that is already another member's identity in the namespace returns
    409.

    A `reauth` approval is not confirmable here. Releasing one means proving a
    factor, which happens on the web terminal re-auth endpoint. Accepting a bare
    confirm would skip the factor, so a `reauth` code returns 403, as does a
    caller whose role cannot approve logins or add SSH keys. Both are checked
    before the approval's state, so they apply to an already-decided code too.
    Otherwise unknown, expired and already-decided codes, and codes from a
    namespace you are not a member of, return 404.
  tags:
    - community
    - ssh-identities
  security:
    - jwt: []
  parameters:
    - name: code
      in: path
      required: true
      schema:
        description: SSH login approval code.
        type: string
        example: WXYZ-2K7Q
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            expires_in:
              description: |
                How many days the key being bound should keep working. Omit it
                for a key that never expires. The gateway refuses a login whose
                key has expired.
              type: integer
              minimum: 1
              example: 30
  responses:
    '200':
      description: |
        The approval was confirmed. The response carries the confirmation code to
        show the approver: they type it at the terminal their login is waiting at,
        which proves they reached this screen rather than merely followed a link,
        and is what binds the key.
      content:
        application/json:
          schema:
            type: object
            required:
              - confirmation_code
            properties:
              confirmation_code:
                description: |
                  The code the approver types back at their terminal. Empty when
                  the request released no held login.
                type: string
                example: WXYZ2K7Q
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '500':
      $ref: ../components/responses/500.yaml
