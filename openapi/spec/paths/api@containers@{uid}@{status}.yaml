patch:
  operationId: updateContainerStatus
  summary: Update a container's status
  description: Update a container's status.
  tags:
    - community
    - containers
  security:
    - jwt: []
    - api-key: []
  parameters:
    - $ref: ../components/parameters/path/deviceUIDPath.yaml
    - name: status
      description: Container's status
      schema:
        $ref: ../components/schemas/deviceStatusAction.yaml
      required: true
      in: path
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            replace:
              description: |
                Confirm that accepting the container replaces an offline accepted
                container in the namespace that reports the same identity: it takes
                that container's name and sessions, and its record is deleted.
                Without it such an accept is refused with a 409 whose `replace`
                field names that container.
              type: boolean
              default: false
  responses:
    '200':
      description: Success to update container status.
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '402':
      $ref: ../components/responses/402.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '500':
      $ref: ../components/responses/500.yaml
