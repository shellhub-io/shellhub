post:
  operationId: authMFA
  summary: Auth MFA
  description: |
    Authenticate a user who has MFA enabled. This endpoint should be called after the default authUser endpoint,
    which generates an `X-MFA-Token` indicating that the user has already authenticated with a password.

    The token logs in once only. An unknown, expired or already used token answers `401`, the same
    as a wrong code. Wrong codes count toward the same account lockout as wrong passwords: check the
    `X-Account-Lockout` header, which is 0 when there is no active lockout.
  tags:
    - cloud
    - mfa
    - users
  security: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/mfaAuth.yaml
  responses:
    '200':
      description: Success to authenticate.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/userAuth.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '429':
      description: Too Many Requests
      headers:
        X-Account-Lockout:
          schema:
            type: integer
            description: Indicates the Unix timestamp in seconds of when the account lockout period ends.
            example: 1711575401
      content:
        application/json:
          schema:
            $ref: ../components/schemas/apiError.yaml
    '500':
      $ref: ../components/responses/500.yaml
