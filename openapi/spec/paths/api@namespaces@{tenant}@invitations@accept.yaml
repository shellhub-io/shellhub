patch:
  operationId: acceptInvite
  summary: Accept a membership invite
  description: |
    Accepts a pending membership invitation for the authenticated user.
    The user must be logged into the account that was invited and send the
    invite code from the invitation link.
  tags:
    - community
    - members
    - namespaces
    - users
  security:
    - jwt: []
  parameters:
    - $ref: ../components/parameters/path/namespaceTenantIDPath.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            code:
              type: string
              example: WXYZ2K7QABCD
              description: The invite code the invitation link carries.
          required:
            - code
  responses:
    '200':
      description: Invitation successfully accepted
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '500':
      $ref: ../components/responses/500.yaml
