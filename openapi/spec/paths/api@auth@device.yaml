post:
  operationId: authDeviceV2
  summary: Auth device v2
  description: |
    Auth a device.

    Every 30 seconds, this route is hit by internal ShellHub to check device
    availability.
  tags:
    - device
  security:
    - jwt: []
    - api-key: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/deviceAuthRequest.yaml
  responses:
    '200':
      description: Success to auth device
      content:
        application/json:
          schema:
            $ref: ../components/schemas/deviceAuthResponse.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '500':
      $ref: ../components/responses/500.yaml
