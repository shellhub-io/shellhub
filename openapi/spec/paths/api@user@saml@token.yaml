post:
  operationId: redeemSamlSignIn
  summary: Redeem a SAML sign-in
  description: |
    Collects the session the assertion consumer service signed in for this
    browser. The browser is named by the cookie `/api/user/saml/auth` and
    `/api/user/saml/request` set when they start a sign-in request,
    `__Host-shellhub_saml_browser` over HTTPS and `shellhub_saml_browser` over
    plain HTTP, so only the browser that started the request collects the
    session, and neither the session token nor anything that collects it
    travels in a URL. A sign-in is
    collected once, within a minute of the sign-in, and collecting it expires
    the cookie.

    To access this endpoint, SAML authentication must be enabled and the
    instance must be running the Enterprise edition. If not, the endpoint
    returns a `501 Not Implemented` status code.
  tags:
    - cloud
    - users
  security: []
  responses:
    '200':
      description: The signed-in session
      content:
        application/json:
          schema:
            $ref: ../components/schemas/userAuth.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '501':
      description: SAML authentication is not enabled or instance is not running Enterprise edition
    '503':
      $ref: ../components/responses/503.yaml
