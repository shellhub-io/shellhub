get:
  operationId: getSamlReauthUrl
  summary: Get SAML re-authentication URL
  description: |
    Returns the URL that starts a ForceAuthn re-authentication of the
    logged-in SSO user at the Identity Provider during a web-terminal step-up
    approval.

    Under the HTTP-Redirect binding, the URL is the Identity Provider's own.
    Under the HTTP-POST binding, it is the path of `/api/user/saml/request` on
    ShellHub with a `relay_state` query parameter, whose page posts the request
    to the Identity Provider.

    Requires an active JWT session; API keys are rejected.
  security:
    - jwt: []
  tags:
    - cloud
    - users
  parameters:
    - name: fingerprint
      in: query
      required: true
      schema:
        type: string
      description: The browser identity fingerprint
    - name: approval_code
      in: query
      required: true
      schema:
        type: string
      description: The SSH approval code for the step-up flow
  responses:
    '200':
      description: Successfully retrieved the SAML re-authentication URL
      content:
        application/json:
          schema:
            type: object
            required:
              - url
            properties:
              url:
                type: string
                description: |
                  The Identity Provider's ForceAuthn login URL under the HTTP-Redirect
                  binding, or the `/api/user/saml/request` path with its `relay_state`,
                  relative to ShellHub's origin, under the HTTP-POST binding
    '401':
      $ref: '../components/responses/401.yaml'
    '500':
      $ref: '../components/responses/500.yaml'
    '501':
      $ref: ../components/responses/501.yaml
    '503':
      $ref: ../components/responses/503.yaml
