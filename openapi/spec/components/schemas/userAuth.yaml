type: object
properties:
  token:
    $ref: jwt.yaml
  id:
    $ref: userID.yaml
  origin:
    $ref: userOrigin.yaml
  user:
    $ref: userUsernameOrEmpty.yaml
  name:
    $ref: userName.yaml
  email:
    $ref: userEmail.yaml
  recovery_email:
    description: |
      The recovery email serves as the user's final recourse to regain access
      to their account.
    type: string
    format: email
  tenant:
    type: string
    nullable: true
    allOf:
      - $ref: namespaceTenantID.yaml
  role:
    type: string
    nullable: true
    allOf:
      - $ref: namespaceMemberRole.yaml
  mfa:
    type: boolean
    description: Indicates whether the user has MFA enabled.
    example: false
  admin:
    type: boolean
    description: Indicates whether the user has admin status.
    example: false
  max_namespaces:
    $ref: maxNamespaces.yaml
  auth_methods:
    $ref: userAuthMethods.yaml
  onboarding_survey:
    $ref: userOnboardingSurvey.yaml
  impersonated:
    type: boolean
    description: |
      Whether an instance administrator signed in as the user. Such a session cannot record the
      onboarding survey outcome.
    example: false
required:
  - token
  - id
  - origin
  - user
  - name
  - email
  - recovery_email
  - tenant
  - role
  - mfa
  - max_namespaces
  - admin
  - auth_methods
  - onboarding_survey
  - impersonated
