allOf:
  - $ref: apiKey.yaml
  - type: object
    properties:
      key:
        description: |
          The credential itself, returned by this operation and never again. Store it when
          it is created; nothing can read it back.
        type: string
        format: uuid
        example: 2f6a1d8e-5b0c-4e77-9a3f-0c1d2e3f4a5b
    required:
      - key
