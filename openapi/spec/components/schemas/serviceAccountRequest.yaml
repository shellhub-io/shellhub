description: Service account creation payload.
type: object
properties:
  name:
    description: User-supplied name for the service account.
    type: string
    example: ci-bot
  data:
    description: |
      The SSH public key to enroll as the service account's first identity, in
      OpenSSH `authorized_keys` format.
    type: string
    example: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILqk ci-bot
  single_use:
    description: |
      Burn the key after one established SSH session. This is the Vault-OTP
      "consume per access" semantic: the key is spent by the first real session,
      not by an enrollment. Defaults to false (reusable).
    type: boolean
    default: false
    example: false
  expires_in:
    description: |
      Key TTL in days from creation. Omit for a key that never expires.
    type: integer
    minimum: 1
    nullable: true
    example: 30
required:
  - name
  - data
