type: object
properties:
  name:
    type: string
    description: |
      The name of the API key. It is unique per namespace and is what the key's own routes
      address it by. It is mutable, so refer to the key by its id from anywhere else.
    maxLength: 20
    minLength: 3
    pattern: ^[a-zA-Z0-9_-]{3,20}$
    example: dev
  role:
    type: string
    description: |
      The role of the key. It serves as a "level" indicating which endpoints the key can
      access. It must be less or equal than the user's role.
    example: owner
