description: Namespace's settings.
type: object
properties:
  session_record:
    $ref: namespaceSessionRecord.yaml
  connection_announcement:
    $ref: namespaceConnectionAnnouncement.yaml
  legacy:
    description: |
      Whether the namespace still runs the legacy model: SSH access by public key ACL (and, on
      Cloud/Enterprise, firewall rules) or password, and device enrollment by `TENANT_ID` alone.
      A new namespace authorizes SSH through SSH identities and Access Policies and enrolls
      devices by pairing or a provisioning key; a device presenting the deprecated `TENANT_ID`
      alone still lands pending. Only namespaces that predate SSH identities and Access Policies
      are legacy; the upgrade endpoint clears it and nothing sets it.
    type: boolean
    readOnly: true
    example: false
  require_verified_device_key:
    $ref: namespaceRequireVerifiedDeviceKey.yaml
required:
  - session_record
  - connection_announcement
  - legacy
  - require_verified_device_key
