description: |
  A provisioning key as the listing returns it, plus the plaintext key. The plaintext is
  returned at creation and afterwards only through the reveal endpoint.
allOf:
  - $ref: provisioningKey.yaml
  - type: object
    properties:
      key:
        type: string
        description: |
          The plaintext provisioning key. Pass it to the installer as `PROVISIONING_KEY`.
        example: c629572a-b643-4301-90fe-4572b00d007e
    required:
      - key
