type: object
properties:
  id:
    description: |
      The key's identifier. It is stable across a rename and is what an access policy
      or an SSH identity refers to. It is not the credential.
    type: string
    format: uuid
    example: c629572a-b643-4301-90fe-4572b00d007e
  tenant_id:
    description: The tenant ID of the namespace with which the key is associated.
    type: string
    format: uuid
    example: 3dd0d1f8-8246-4519-b11a-a3dd33717f65
  created_by:
    $ref: userID.yaml
  role:
    type: string
    description: |
      The role of the key. It serves as a "level" indicating which endpoints the key can
      access.
    example: owner
  name:
    type: string
    description: |
      The name of the API key. It is unique per namespace and is what the key's own routes
      address it by. It is mutable, so refer to the key by its id from anywhere else.
    example: dev
  expires_in:
    description: |
      Epoch time until expiration. It for unlimited keys.
    type: integer
    minimum: -1
    example: 1707958989
  created_at:
    type: string
    description: The UTC date when the key was created.
    format: date-time
    example: 2020-05-01T00:00:00.000Z
  updated_at:
    type: string
    description: |
      The UTC date when the key was last updated. It is updated whenever the key is modified.
    format: date-time
    example: 2020-05-01T00:00:00.000Z
required:
  - id
  - tenant_id
  - created_by
  - role
  - name
  - expires_in
  - created_at
  - updated_at
