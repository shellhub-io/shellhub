type: object
description: |
  The factor that proves the caller owns the account: `password` for a user without MFA, `code` for
  a user with MFA. One of the two must be present.
properties:
  password:
    description: The account's current password, for a user without MFA.
    type: string
    example: secret123
  code:
    description: The code generated by the MFA app, for a user with MFA. A recovery code is refused.
    type: string
    example: '123456'
