description: |
  Access policy's device filter. `all` is true when the policy selects every
  device, and `tags` is then an empty array.
type: object
properties:
  all:
    description: Whether the policy selects every device.
    type: boolean
  tags:
    description: Tags the policy selects devices by.
    type: array
    items:
      $ref: tag.yaml
    minItems: 0
    maxItems: 3
required:
  - all
  - tags
