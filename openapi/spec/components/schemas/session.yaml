# Session object containing information about an active or completed session
type: object
properties:
  uid:
    $ref: sessionUID.yaml
  device_uid:
    $ref: deviceUID.yaml
  device:
    type: object
    nullable: true
    allOf:
      - $ref: device.yaml
  tenant_id:
    $ref: namespaceTenantID.yaml
  username:
    description: Session's username
    type: string
  ip_address:
    description: Session's IP address
    type: string
    pattern: ^[0-9]{1,3}(\.[0-9]{1,3}){3}$
    example: 127.0.0.1
  started_at:
    description: Session's started date
    type: string
    example: 2020-01-01T00:00:00Z
  last_seen:
    description: Session's last seen date
    type: string
    example: 2020-01-01T00:00:00Z
  active:
    description: Session's active status
    type: boolean
  authenticated:
    description: Session's authenticated status
    type: boolean
  recorded:
    description: Session's recorded status
    type: boolean
  term:
    description: Session's terminal
    type: string
    example: xterm.js
  web:
    description: Whether the session originated from the web terminal
    type: boolean
  principal:
    $ref: sessionPrincipal.yaml
  position:
    description: Session's geolocation position
    type: object
    properties:
      latitude:
        description: Session's latitude position
        type: number
        example: -31.7566628
      longitude:
        description: Session's longitude position
        type: number
        example: -52.322474
  events:
    description: Session's events
    type: object
    properties:
      types:
        description: Session's set of types
        type: array
        items:
          type: string
          example: shell
      seats:
        description: Session's seats
        type: array
        items:
          type: integer
          minimum: 0
        example:
          - 0
      first:
        description: >-
          The type of the event the session opened with, taken from the request types that open a
          channel. Absent when the session recorded none of them.
        type: string
        enum:
          - pty-req
          - shell
          - exec
          - subsystem
        example: shell
      items:
        description: >-
          The session's events, oldest first. Carried by GET /sessions/{uid} and never by the
          list. It excludes the terminal output the recording carries, and is capped,
          so it is not necessarily every event the session recorded.
        type: array
        items:
          type: object
          properties:
            type:
              description: The type of the event
              type: string
              example: 'shell'
            timestamp:
              description: The time the event occurred in ISO 8601 format
              type: string
              format: date-time
              example: '2023-10-01T12:00:00Z'
            data:
              description: >-
                The event's payload, whose shape follows the SSH request it came from: an object
                for a request that carries fields, such as the terminal a pty request asked for or
                the command an exec ran, and an empty string for one the protocol defines as having
                no body, such as a shell request. Absent when the event recorded no payload at all.
            seat:
              description: Seat where the event happened
              type: integer
              minimum: 0
required:
  - uid
  - device
  - tenant_id
  - username
  - ip_address
  - started_at
  - last_seen
  - active
  - authenticated
  - recorded
  - term
  - web
  - position
  - events
