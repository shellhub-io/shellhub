description: The mutable parts of a namespace. Every field is optional; only what is sent is changed.
type: object
properties:
  name:
    $ref: namespaceName.yaml
  settings:
    description: Namespace's settings. Whether the namespace is legacy is not accepted here; the upgrade has its own endpoint.
    type: object
    properties:
      session_record:
        $ref: namespaceSessionRecord.yaml
      connection_announcement:
        $ref: namespaceConnectionAnnouncement.yaml
      require_verified_device_key:
        $ref: namespaceRequireVerifiedDeviceKey.yaml
