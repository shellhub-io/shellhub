description: What an agent sends to authenticate its device.
type: object
properties:
  info:
    $ref: deviceInfo.yaml
  sessions:
    type: array
    items:
      type: string
  hostname:
    type: string
    pattern: ^([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\-]*[a-zA-Z0-9])(\.([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\-]*[a-zA-Z0-9]))*$
    example: device-hostname
  identity:
    $ref: deviceIdentity.yaml
  public_key:
    description: Device's public key in PEM format.
    type: string
    example: "-----BEGIN RSA PUBLIC KEY-----\nMIIBCgKCAQEA0vH2Bob3mn+uWVaHlOoZD8ai01W6VnRTnXlnHVF7Ny1Vb7pl1Hc4\nD8bsBhb1vt7aZOYHbCyDR2r5lsrWXCELE8pY8vzfFDA+jNrLbBCJ66E1BcmTqfXC\nJcLospWD2lIAwU2O7IPxwZujuVkHrF8nYuEFsKeG60QTWNS++RTqydqe2KmFMEdW\nCQmYPm/ykN871fSR9+PzoRJMYWidY6Szn+X2ardGmS/Ldhl/PEu9h7xjcQXANWz6\nyV/RVReGVkLcK6TxlfuxgdpbsWAx+cS52P7xWrshNefHqjpdlm3KNbo6vqfTpU8L\nd/FFISXXaa1Md5GyAHF+jzuRzQ5z5aKBGwIDAQAB\n-----END RSA PUBLIC KEY-----"
  tenant_id:
    $ref: namespaceTenantID.yaml
  provisioning_key:
    description: Provisioning key that enrolls the device in place of a tenant ID.
    type: string
  challenge:
    description: |
      A challenge issued by the device auth challenge route. Sent with `signature`, it proves
      the agent holds the private half of `public_key`; a device that has proven it once is
      refused any later request without the proof.
    type: string
    maxLength: 64
  signature:
    description: |
      The base64 SSH wire-format signature, made with the device's private key, over the SSH
      wire encoding of the strings "shellhub-device-auth-v1", the challenge, the tenant ID, the
      provisioning key and the public key, in that order, each empty when the request omits it.
    type: string
    maxLength: 2048
required:
  - info
  - public_key
allOf:
  - anyOf:
      - required:
          - hostname
      - required:
          - identity
  - anyOf:
      - required:
          - tenant_id
      - required:
          - provisioning_key
