description: Manual SSH identity enrollment payload.
type: object
properties:
  name:
    description: User-supplied label for the key.
    type: string
    example: laptop
  data:
    description: |
      The SSH public key to enroll, in OpenSSH `authorized_keys` format.
    type: string
    example: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILqk user@laptop
  source:
    description: |
      Whether somebody added this key by hand (`manual`, the default) or the
      web terminal is registering the one it holds in a browser (`browser`).

      It labels the identity and is never an authorization input. `approval` is
      not accepted here; the server sets that one itself.
    type: string
    enum:
      - manual
      - browser
    default: manual
    example: browser
  expires_in:
    description: |
      How many days the key should keep working. Omit it for a key that never
      expires. The gateway refuses a login whose key has expired.
    type: integer
    minimum: 1
    example: 30
required:
  - name
  - data
