services:
  redis:
    image: valkey/valkey:9.1-alpine
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      start_period: 10s
      retries: 20
  server:
    depends_on:
      minio:
        condition: service_healthy
