services:
  redis:
    image: valkey/valkey:9.1-alpine
  minio:
    image: quay.io/minio/minio:RELEASE.2025-05-24T17-08-30Z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      start_period: 10s
      retries: 20
  server:
    depends_on:
      minio:
        condition: service_healthy
