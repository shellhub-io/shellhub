services:
  postgres:
    image: postgres:18.0
    # lz4 compresses full-page images; safe to pin because the image tag above is pinned too,
    # and a build without lz4 support would refuse to start.
    command: postgres -c io_method=worker -c wal_compression=lz4
    restart: unless-stopped
    healthcheck:
      start_period: 90s
      interval: 5s
      timeout: 5s
      retries: 5
      test: ["CMD-SHELL", "pg_isready -U ${SHELLHUB_POSTGRES_USERNAME} -d ${SHELLHUB_POSTGRES_DATABASE}"]
    environment:
      - POSTGRES_USER=${SHELLHUB_POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${SHELLHUB_POSTGRES_PASSWORD}
      - POSTGRES_DB=${SHELLHUB_POSTGRES_DATABASE}
    networks:
      - shellhub
  server:
    depends_on:
      postgres:
        condition: service_healthy
