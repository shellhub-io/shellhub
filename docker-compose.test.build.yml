services:
  server:
    pull_policy: build
    build:
      context: .
      dockerfile: server/Dockerfile
      target: production
      args:
        EDITION: ${SHELLHUB_BUILD_EDITION:-community}
      additional_contexts:
        cloud-src: ${SHELLHUB_CLOUD_SRC:-.}
  gateway:
    pull_policy: build
    build:
      context: .
      dockerfile: gateway/Dockerfile
      target: production
  ui:
    pull_policy: build
    build:
      context: .
      dockerfile: ui/Dockerfile
      target: production
