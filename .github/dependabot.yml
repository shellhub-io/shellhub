version: 2

updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    codeql:
      patterns:
        - "github/codeql-action/*"

- package-ecosystem: docker
  directories:
    - "/agent"
    - "/gateway"
    - "/openapi"
    - "/server"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "docker"
  # The Go image follows the toolchain pinned in go.mod, so it only moves when we
  # bump the toolchain ourselves.
  ignore:
    - dependency-name: "golang"
      update-types: ["version-update:semver-major", "version-update:semver-minor"]
- package-ecosystem: docker
  directory: "/ui"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "docker"
  ignore:
    - dependency-name: "node"
      update-types: ["version-update:semver-major"]
      versions: [">=25"]

- package-ecosystem: npm
  directory: "/ui"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "ui"
  versioning-strategy: lockfile-only
  groups:
    tiptap:
      patterns:
        - "@tiptap/*"

# Indirect dependencies come along when `devscripts/prepare-release` re-resolves the
# module, so only direct ones are allowed here: an indirect bump on its own lands
# ahead of the dependency that pins it and cannot build.
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "pkg"
  allow:
    - dependency-type: direct
- package-ecosystem: gomod
  directory: "/server"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "server"
  allow:
    - dependency-type: direct
  ignore:
    - dependency-name: "github.com/shellhub-io/shellhub"
- package-ecosystem: gomod
  directory: "/agent"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "agent"
  allow:
    - dependency-type: direct
  ignore:
    - dependency-name: "github.com/shellhub-io/shellhub"
- package-ecosystem: gomod
  directory: "/gateway"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "gateway"
  allow:
    - dependency-type: direct
  groups:
    caddy:
      patterns:
        - "github.com/caddyserver/*"
        - "github.com/caddy-dns/*"
  ignore:
    - dependency-name: "github.com/shellhub-io/shellhub"
- package-ecosystem: gomod
  directory: "/openapi"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "openapi"
  allow:
    - dependency-type: direct
  ignore:
    - dependency-name: "github.com/shellhub-io/shellhub"
- package-ecosystem: gomod
  directory: "/tests"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "tests"
  allow:
    - dependency-type: direct
  ignore:
    - dependency-name: "github.com/shellhub-io/shellhub"
