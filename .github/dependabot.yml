version: 2

updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  open-pull-requests-limit: 5
  groups:
    actions:
      applies-to: version-updates
      patterns:
        - "*"

- package-ecosystem: docker
  directories:
    - "/agent"
    - "/gateway"
    - "/openapi"
    - "/server"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "docker"
  open-pull-requests-limit: 5
  groups:
    images:
      applies-to: version-updates
      group-by: dependency-name
      patterns:
        - "*"
  ignore:
    - dependency-name: "golang"
      update-types: ["version-update:semver-major", "version-update:semver-minor"]
- package-ecosystem: docker
  directory: "/ui"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "docker"
  open-pull-requests-limit: 5
  ignore:
    - dependency-name: "node"
      update-types: ["version-update:semver-major"]
      versions: [">=25"]

- package-ecosystem: npm
  directory: "/ui"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "ui"
  versioning-strategy: lockfile-only
  open-pull-requests-limit: 5
  groups:
    react:
      patterns:
        - "react"
        - "react-dom"
        - "@types/react"
        - "@types/react-dom"
    ui:
      applies-to: version-updates
      update-types:
        - minor
        - patch
      exclude-patterns:
        - "react"
        - "react-dom"
        - "@types/react"
        - "@types/react-dom"

- package-ecosystem: gomod
  directories:
    - "/"
    - "/agent"
    - "/gateway"
    - "/openapi"
    - "/server"
    - "/tests"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "deps"
  open-pull-requests-limit: 10
  allow:
    - dependency-type: direct
  groups:
    caddy:
      patterns:
        - "github.com/caddyserver/*"
        - "github.com/caddy-dns/*"
    testcontainers:
      patterns:
        - "github.com/testcontainers/testcontainers-go"
        - "github.com/testcontainers/testcontainers-go/*"
    bun:
      patterns:
        - "github.com/uptrace/bun"
        - "github.com/uptrace/bun/*"
    golang-x:
      applies-to: version-updates
      patterns:
        - "golang.org/x/*"
    go-modules:
      applies-to: version-updates
      group-by: dependency-name
      patterns:
        - "*"
      exclude-patterns:
        - "github.com/caddyserver/*"
        - "github.com/caddy-dns/*"
        - "github.com/testcontainers/testcontainers-go"
        - "github.com/testcontainers/testcontainers-go/*"
        - "github.com/uptrace/bun"
        - "github.com/uptrace/bun/*"
        - "golang.org/x/*"
  ignore:
    - dependency-name: "github.com/shellhub-io/shellhub"
    - dependency-name: "github.com/labstack/echo-contrib"
      versions: [">=0.50.0"]
