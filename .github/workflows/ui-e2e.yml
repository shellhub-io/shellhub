name: UI E2E

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    if: ${{ github.event_name != 'workflow_dispatch' && github.event.pull_request.draft == false }}

    runs-on: octocat-microvm

    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      images: ${{ steps.filter.outputs.images }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            e2e:
              - 'ui/**'
              - 'tests/**'
              - 'openapi/**'
              - 'docker-compose*.yml'
              - 'versions.env'
              - '.github/workflows/ui-e2e.yml'
              - '.github/workflows/ui-e2e-run.yml'
            images:
              - 'server/**'
              - 'gateway/**'
              - 'agent/**'
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - 'install.sh'
              - '.dockerignore'

  e2e:
    name: e2e
    needs: changes
    if: ${{ !failure() && !cancelled() && github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e == 'true') }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ui-e2e-run.yml
    secrets:
      CLOUD_DISPATCH_APP_ID: ${{ secrets.CLOUD_DISPATCH_APP_ID }}
      CLOUD_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.CLOUD_DISPATCH_APP_PRIVATE_KEY }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PRICE_ID: ${{ secrets.STRIPE_TEST_PRICE_ID }}
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}

  e2e-master:
    name: e2e
    needs: changes
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && (needs.changes.outputs.e2e == 'true' || needs.changes.outputs.images == 'true') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ui-e2e-run.yml
    with:
      push-images: true
    secrets:
      CLOUD_DISPATCH_APP_ID: ${{ secrets.CLOUD_DISPATCH_APP_ID }}
      CLOUD_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.CLOUD_DISPATCH_APP_PRIVATE_KEY }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PRICE_ID: ${{ secrets.STRIPE_TEST_PRICE_ID }}
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
