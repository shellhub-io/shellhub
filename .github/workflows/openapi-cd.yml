name: OpenAPI Continuous Delivery

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  openapi-bundle:
    name: Bundle OpenAPI Specifications
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"

      - name: Setup bundler
        run: |
          VERSION=$(sed -n 's/^REDOCLY_VERSION=//p' versions.env)
          [ -n "$VERSION" ] || { echo "could not read REDOCLY_VERSION from versions.env"; exit 1; }
          npm install -g "@redocly/cli@$VERSION"
          mkdir bundled/

      - name: Bundle customer documentation
        working-directory: openapi
        run: |
          redocly bundle community-customer@v1 -o ../bundled/community-openapi.yaml
          redocly bundle cloud-customer@v1 -o ../bundled/cloud-openapi.yaml
          redocly bundle enterprise-customer@v1 -o ../bundled/enterprise-openapi.yaml

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundled
          path: bundled/

  openapi-delivery:
    name: Deliver OpenAPI Specifications
    runs-on: self-hosted
    needs:
      - openapi-bundle

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup uploader
        run: mkdir bundled/

      - name: Download artificats
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bundled
          path: bundled/

      - name: Delivery OpenAPI to Space
        uses: BetaHuhn/do-spaces-action@47f34d70b97cced8e8dbb50e2ecfaaf4381593a7 # v2
        with:
          access_key: ${{ secrets.SPACE_ACCESS_KEY }}
          secret_key: ${{ secrets.SPACE_SECRET_KEY }}
          space_name: ${{ secrets.SPACE_NAME }}
          space_region: ${{ secrets.SPACE_REGION }}
          source: bundled/
