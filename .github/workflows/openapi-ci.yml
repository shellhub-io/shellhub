name: OpenAPI Continuous Integration

on:
  push:
    branches: [master]
    paths:
      - 'openapi/**'
      - 'versions.env'
  pull_request:
    branches: [master]
    paths:
      - 'openapi/**'
      - 'versions.env'

  workflow_dispatch:

jobs:
  openapi-ci:
    name: OpenAPI CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
      - name: Setup Prettier
        run: |
          VERSION=$(sed -n 's/^PRETTIER_VERSION=//p' versions.env)
          [ -n "$VERSION" ] || { echo "could not read PRETTIER_VERSION from versions.env"; exit 1; }
          npm install -g "prettier@$VERSION"

      - name: Run Prettier lint on project
        run: prettier -c 'openapi/spec/**/*.yaml'

      - name: Setup Redocly
        run: |
          VERSION=$(sed -n 's/^REDOCLY_VERSION=//p' versions.env)
          [ -n "$VERSION" ] || { echo "could not read REDOCLY_VERSION from versions.env"; exit 1; }
          npm install -g "@redocly/cli@$VERSION"

      - name: Run Redocly lint
        working-directory: openapi
        run: redocly lint spec/openapi.yaml spec/community-openapi.yaml spec/cloud-openapi.yaml spec/enterprise-openapi.yaml

      - name: Bundle customer specs (exercise the customer-filter plugin)
        working-directory: openapi
        run: |
          for edition in community cloud enterprise; do
            redocly bundle "${edition}-customer@v1" -o "/tmp/${edition}-customer.json"
          done
