name: Semgrep

on:
  push:
    tags: [v*]

  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: semgrep
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.154.0

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git (semgrep container runs as different user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # nosemgrep-suppressed findings as blocking, so --error would ignore every
      - name: Run Semgrep (PR — baseline diff)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          semgrep scan \
            --config p/golang \
            --config p/dockerfile \
            --config p/ci \
            --baseline-commit ${{ github.event.pull_request.base.sha }} \
            --sarif \
            --output semgrep.sarif \
            .

      - name: Run Semgrep (tag / schedule — full scan)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          semgrep scan \
            --config p/golang \
            --config p/dockerfile \
            --config p/ci \
            --sarif \
            --output semgrep.sarif \
            .

      - name: Upload SARIF report
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Evaluate findings
        if: ${{ always() }}
        env:
          ENFORCE: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          with open("semgrep.sarif") as fd:
              sarif = json.load(fd)

          results = [r for run in sarif.get("runs", []) for r in run.get("results", [])]
          blocking = [r for r in results if not r.get("suppressions")]

          for r in blocking:
              loc = r["locations"][0]["physicalLocation"]
              path = loc["artifactLocation"]["uri"]
              line = loc["region"]["startLine"]
              print(f"{path}:{line}  {r['ruleId']}")

          suppressed = len(results) - len(blocking)
          print(f"\n{len(blocking)} blocking, {suppressed} suppressed via nosemgrep")

          if not blocking:
              sys.exit(0)

          if os.environ["ENFORCE"] != "true":
              print("Report-only for this event; not failing the build.")
              sys.exit(0)

          sys.exit(1)
          PY

  security-gate:
    name: security-gate
    needs: [scan]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check Semgrep results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more Semgrep scan jobs failed or were cancelled."
            exit 1
          fi
          echo "All Semgrep scan jobs passed or were skipped."
