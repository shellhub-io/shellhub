name: docker-build

on:
  push:
    branches: [master]
    paths:
      - "**Dockerfile"

  pull_request:
    branches: [master]
    paths:
      - "**Dockerfile"

jobs:
  build:
    name: Build '${{ matrix.project }}' Docker container

    strategy:
      fail-fast: false
      matrix:
        project: [server, gateway]

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build '${{ matrix.project }}' Docker container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          tags: shellhubio/${{ matrix.project }}:latest
          push: false
          file: ${{ matrix.project }}/Dockerfile

