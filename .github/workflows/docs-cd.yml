name: Docs CD

on:
  # No path filter on push. A release publishes the site, and a tag carries no dependable list of
  # changed files, so a filtered trigger would skip it.
  push:
    branches:
      - master
      - docs/stable
    tags:
      - v*
  pull_request:
    paths:
      - "ui/apps/docs/**"
      - "ui/packages/design-system/**"
      - ".github/workflows/docs-cd.yml"
  workflow_dispatch:

concurrency:
  group: docs-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release publishes the site, so the tag has to say whether it is one anybody should be sent
  # to. `is-latest-tag` answers that the same way the image publishing does, and a pre-release
  # stops here instead of spending a build.
  channel:
    name: Decide what this build describes
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      channel: ${{ steps.decide.outputs.channel }}
      branch: ${{ steps.decide.outputs.branch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Is this tag the latest release
        id: latest
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/is-latest-tag
        with:
          tag: ${{ github.ref_name }}

      - name: Decide
        id: decide
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          IS_LATEST: ${{ steps.latest.outputs.is_latest }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$IS_TAG" = "true" ] && [ "$IS_LATEST" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

          # A release and the branch are the same channel to a reader, and `docs/stable` is the
          # project's production branch, which is what promotes a deployment to the site.
          if [ "$IS_TAG" = "true" ] || [ "$REF_NAME" = "docs/stable" ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "branch=docs/stable" >> "$GITHUB_OUTPUT"
          else
            echo "channel=unreleased" >> "$GITHUB_OUTPUT"
            echo "branch=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build and deploy the documentation
    runs-on: ubuntu-latest

    needs: channel
    if: needs.channel.outputs.publish == 'true'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.JS 24.13.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.0"

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ui/node_modules
          key: ${{ runner.OS }}-ui-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Node dependencies
        working-directory: ui
        run: npm install

      - name: Astro sync
        working-directory: ui
        run: npm run sync -w @shellhub/docs

      # CI is set by Actions, which is what makes the build refuse a declared screenshot with
      # no image and an image no page references, instead of quietly rewriting the checkout.
      - name: Build
        working-directory: ui
        env:
          PUBLIC_DOCS_CHANNEL: ${{ needs.channel.outputs.channel }}
        run: npm run build -w @shellhub/docs

      # Only `docs/stable`, the project's production branch, publishes to the site. Every other
      # name lands on a preview URL, which is how master and open pull requests get read. The
      # name is a label on the deployment, not a git branch, so a release tag carries the one
      # that promotes it.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ui/apps/docs/dist
            --project-name=shellhub-docs
            --branch=${{ needs.channel.outputs.branch }}

      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            if (!url) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Documentation preview: ${url}`,
            });
