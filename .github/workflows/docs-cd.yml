name: Docs CD

on:
  push:
    branches:
      - master
      - docs/stable
    tags:
      - v*
  pull_request:
    paths:
      - "ui/apps/docs/**"
      - "ui/packages/design-system/**"
      - ".github/workflows/docs-cd.yml"
  workflow_dispatch:

concurrency:
  group: docs-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  channel:
    name: Decide what this build describes
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      channel: ${{ steps.decide.outputs.channel }}
      branch: ${{ steps.decide.outputs.branch }}
      version: ${{ steps.decide.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Is this tag the latest release
        id: latest
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/is-latest-tag
        with:
          tag: ${{ github.ref_name }}

      - name: Decide
        id: decide
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          IS_LATEST: ${{ steps.latest.outputs.is_latest }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$IS_TAG" = "true" ] && [ "$IS_LATEST" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

          git fetch --tags --quiet
          version=$(grep '^SHELLHUB_VERSION=' .env | cut -d= -f2-)
          if ! git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            version=$(git -c versionsort.suffix=-rc tag -l 'v*' --sort=-v:refname | head -n1)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$IS_TAG" = "true" ] || [ "$REF_NAME" = "docs/stable" ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "branch=docs/stable" >> "$GITHUB_OUTPUT"
          else
            echo "channel=unreleased" >> "$GITHUB_OUTPUT"
            echo "branch=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build and deploy the documentation
    runs-on: ubuntu-latest

    needs: channel
    if: needs.channel.outputs.publish == 'true'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ui/node_modules
          key: ${{ runner.OS }}-ui-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Node dependencies
        working-directory: ui
        run: npm install

      - name: Astro sync
        working-directory: ui
        run: npm run sync -w @shellhub/docs

      - name: Build
        working-directory: ui
        env:
          PUBLIC_DOCS_CHANNEL: ${{ needs.channel.outputs.channel }}
          PUBLIC_SHELLHUB_VERSION: ${{ needs.channel.outputs.version }}
        run: npm run build -w @shellhub/docs

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ui/apps/docs/dist
            --project-name=shellhub-docs
            --branch=${{ needs.channel.outputs.branch }}

      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            if (!url) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Documentation preview: ${url}`,
            });
