name: Security

on:
  push:
    tags: [v*]

  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  security-gate:
    name: security-gate
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: octocat-microvm

    env:
      UPLOAD_SARIF: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Route Docker Hub pulls through the registry cache
        uses: ./.github/actions/dockerhub-mirror
        with:
          username: ${{ secrets.PORTUS_USERNAME }}
          password: ${{ secrets.PORTUS_TOKEN }}

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name == 'pull_request'
        id: changes
        with:
          filters: |
            dependencies:
              - '**/go.mod'
              - '**/go.sum'
              - '**/Dockerfile'
              - 'versions.env'
              - '.trivyignore'
              - '.github/workflows/security.yml'

      - name: Decide whether the dependency scans run
        id: scans
        if: github.event_name != 'pull_request' || steps.changes.outputs.dependencies == 'true'
        run: echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Run Semgrep against the pull request's base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${DOCKERHUB_MIRROR}semgrep/semgrep:1.154.0" sh -c '
            git config --global --add safe.directory /src &&
            semgrep scan --config p/golang --config p/dockerfile --config p/ci \
              --baseline-commit "$0" --sarif --output semgrep.sarif .
          ' "$BASE_SHA"

      - name: Run Semgrep over the whole tree
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${DOCKERHUB_MIRROR}semgrep/semgrep:1.154.0" \
            semgrep scan --config p/golang --config p/dockerfile --config p/ci \
              --sarif --output semgrep.sarif .

      - name: Upload the Semgrep SARIF report
        if: ${{ !cancelled() && env.UPLOAD_SARIF == 'true' && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Evaluate the Semgrep findings
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        env:
          ENFORCE: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          with open("semgrep.sarif") as fd:
              sarif = json.load(fd)

          results = [r for run in sarif.get("runs", []) for r in run.get("results", [])]
          blocking = [r for r in results if not r.get("suppressions")]

          for r in blocking:
              loc = r["locations"][0]["physicalLocation"]
              path = loc["artifactLocation"]["uri"]
              line = loc["region"]["startLine"]
              print(f"{path}:{line}  {r['ruleId']}")

          suppressed = len(results) - len(blocking)
          print(f"\n{len(blocking)} blocking, {suppressed} suppressed via nosemgrep")

          if not blocking:
              sys.exit(0)

          if os.environ["ENFORCE"] != "true":
              print("Report-only for this event; not failing the build.")
              sys.exit(0)

          sys.exit(1)
          PY

      - name: Set up Go
        if: ${{ !cancelled() && steps.scans.outputs.run == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the Go caches
        if: ${{ !cancelled() && steps.scans.outputs.run == 'true' }}
        uses: ./.github/actions/go-cache
        with:
          name: security

      - name: Run govulncheck on every module
        if: ${{ !cancelled() && steps.scans.outputs.run == 'true' }}
        run: |
          VERSION=$(sed -n 's/^GOVULNCHECK_VERSION=//p' versions.env)
          if [ -z "$VERSION" ]; then
              echo "could not read GOVULNCHECK_VERSION from versions.env"
              exit 1
          fi
          go install golang.org/x/vuln/cmd/govulncheck@"$VERSION"
          govulncheck="$(go env GOPATH)/bin/govulncheck"

          failed=0
          for module in root:. server:server agent:agent gateway:gateway openapi:openapi tests:tests; do
              name=${module%%:*}
              dir=${module#*:}
              sarif="$GITHUB_WORKSPACE/govulncheck-$name.sarif"
              goflags=""
              [ "$name" = agent ] && goflags="-tags=docker"

              echo "::group::govulncheck ($name)"
              if ! (cd "$dir" && GOFLAGS="$goflags" "$govulncheck" -format sarif ./... >"$sarif"); then
                  rm -f "$sarif"
                  echo "::error title=govulncheck ($name)::govulncheck could not scan the module"
                  failed=1
              fi
              echo "::endgroup::"
          done

          exit "$failed"

      - name: Upload the govulncheck SARIF report (root)
        if: ${{ !cancelled() && env.UPLOAD_SARIF == 'true' && hashFiles('govulncheck-root.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: govulncheck-root.sarif
          category: govulncheck-root

      - name: Upload the govulncheck SARIF report (server)
        if: ${{ !cancelled() && env.UPLOAD_SARIF == 'true' && hashFiles('govulncheck-server.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: govulncheck-server.sarif
          category: govulncheck-server

      - name: Upload the govulncheck SARIF report (agent)
        if: ${{ !cancelled() && env.UPLOAD_SARIF == 'true' && hashFiles('govulncheck-agent.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: govulncheck-agent.sarif
          category: govulncheck-agent

      - name: Upload the govulncheck SARIF report (gateway)
        if: ${{ !cancelled() && env.UPLOAD_SARIF == 'true' && hashFiles('govulncheck-gateway.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: govulncheck-gateway.sarif
          category: govulncheck-gateway

      - name: Upload the govulncheck SARIF report (openapi)
        if: ${{ !cancelled() && env.UPLOAD_SARIF == 'true' && hashFiles('govulncheck-openapi.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: govulncheck-openapi.sarif
          category: govulncheck-openapi

      - name: Upload the govulncheck SARIF report (tests)
        if: ${{ !cancelled() && env.UPLOAD_SARIF == 'true' && hashFiles('govulncheck-tests.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: govulncheck-tests.sarif
          category: govulncheck-tests

      - name: Set up Docker Buildx
        if: ${{ !cancelled() && steps.scans.outputs.run == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.DOCKERHUB_MIRROR }}moby/buildkit:buildx-stable-1

      - name: Read the build versions
        if: ${{ !cancelled() && steps.scans.outputs.run == 'true' }}
        id: versions
        run: |
          {
            echo 'build-args<<EOF'
            cat versions.env
            echo "DOCKERHUB_MIRROR=${DOCKERHUB_MIRROR:-}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build the server image
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: server/Dockerfile
          tags: shellhub/server:scan
          push: false
          load: true
          build-args: ${{ steps.versions.outputs.build-args }}

      - name: Build the gateway image
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: gateway/Dockerfile
          tags: shellhub/gateway:scan
          push: false
          load: true
          build-args: ${{ steps.versions.outputs.build-args }}

      - name: Build the ui image
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ui/Dockerfile
          tags: shellhub/ui:scan
          push: false
          load: true
          build-args: ${{ steps.versions.outputs.build-args }}

      - name: Build the agent image
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: agent/Dockerfile
          tags: shellhub/agent:scan
          push: false
          load: true
          build-args: ${{ steps.versions.outputs.build-args }}

      - name: Scan the images with Trivy
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        run: |
          mkdir -p "$HOME/.cache/trivy"

          trivy() {
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -v "$GITHUB_WORKSPACE:/work" \
                -v "$HOME/.cache/trivy:/root/.cache/trivy" \
                ghcr.io/aquasecurity/trivy:0.63.0 image \
                  --severity CRITICAL,HIGH \
                  --ignore-unfixed \
                  --scanners vuln \
                  --ignorefile /work/.trivyignore \
                  "$@"
          }

          failed=0
          for image in server gateway ui agent; do
              if ! docker image inspect "shellhub/$image:scan" >/dev/null 2>&1; then
                  echo "::error title=trivy ($image)::the image did not build"
                  failed=1
                  continue
              fi

              echo "::group::trivy ($image)"
              if ! trivy --format sarif --output "/work/trivy-$image.sarif" "shellhub/$image:scan"; then
                  rm -f "trivy-$image.sarif"
                  echo "::error title=trivy ($image)::trivy could not scan the image"
                  failed=1
              fi
              trivy --exit-code 1 "shellhub/$image:scan" || { echo "::error title=trivy ($image)::vulnerabilities found"; failed=1; }
              echo "::endgroup::"
          done

          exit "$failed"

      - name: Upload the Trivy SARIF report (server)
        if: ${{ !cancelled() && env.UPLOAD_SARIF == 'true' && hashFiles('trivy-server.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-server.sarif
          category: trivy-server

      - name: Upload the Trivy SARIF report (gateway)
        if: ${{ !cancelled() && env.UPLOAD_SARIF == 'true' && hashFiles('trivy-gateway.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-gateway.sarif
          category: trivy-gateway

      - name: Upload the Trivy SARIF report (ui)
        if: ${{ !cancelled() && env.UPLOAD_SARIF == 'true' && hashFiles('trivy-ui.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-ui.sarif
          category: trivy-ui

      - name: Upload the Trivy SARIF report (agent)
        if: ${{ !cancelled() && env.UPLOAD_SARIF == 'true' && hashFiles('trivy-agent.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-agent.sarif
          category: trivy-agent

      - name: Save the Go caches
        if: ${{ !cancelled() && steps.scans.outputs.run == 'true' }}
        uses: ./.github/actions/go-cache
        with:
          name: security
          save: true
