name: Security

on:
  push:
    tags: [v*]

  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - '**/Dockerfile'
      - 'versions.env'
      - '.trivyignore'
      - '.github/workflows/security.yml'

  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    if: ${{ github.event.pull_request.draft == false }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: .
            sarif_name: root
            tags: ""
          - module: server
            sarif_name: server
            tags: ""
          - module: agent
            sarif_name: agent
            tags: docker
          - module: gateway
            sarif_name: gateway
            tags: ""
          - module: openapi
            sarif_name: openapi
            tags: ""
          - module: tests
            sarif_name: tests
            tags: ""

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        env:
          GOFLAGS: ${{ matrix.tags != '' && format('-tags={0}', matrix.tags) || '' }}
        with:
          go-version-file: ${{ matrix.module == '.' && 'go.mod' || format('{0}/go.mod', matrix.module) }}
          work-dir: ${{ matrix.module }}
          go-package: ./...
          output-format: sarif
          output-file: govulncheck-${{ matrix.sarif_name }}.sarif
          repo-checkout: false

      - name: Upload SARIF report
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: govulncheck-${{ matrix.sarif_name }}.sarif
          category: govulncheck-${{ matrix.sarif_name }}

  trivy-image:
    name: trivy-image (${{ matrix.image }})
    if: ${{ github.event.pull_request.draft == false }}

    strategy:
      fail-fast: false
      matrix:
        image: [server, gateway, ui, agent]

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read the build versions
        id: versions
        run: |
          {
            echo 'build-args<<EOF'
            cat versions.env
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          tags: shellhub/${{ matrix.image }}:scan
          push: false
          load: true
          build-args: ${{ steps.versions.outputs.build-args }}

      - name: Scan ${{ matrix.image }} image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/work:ro" \
            ghcr.io/aquasecurity/trivy:0.63.0 image \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --scanners vuln \
              --exit-code 1 \
              --ignorefile /work/.trivyignore \
              shellhub/${{ matrix.image }}:scan

      - name: Scan ${{ matrix.image }} image with Trivy (SARIF)
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/work" \
            ghcr.io/aquasecurity/trivy:0.63.0 image \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --scanners vuln \
              --format sarif \
              --output /work/trivy-${{ matrix.image }}.sarif \
              --ignorefile /work/.trivyignore \
              shellhub/${{ matrix.image }}:scan

      - name: Upload SARIF report
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  security-gate:
    name: security-gate
    needs: [govulncheck, trivy-image]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check scan results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more security scan jobs failed or were cancelled."
            exit 1
          fi
          echo "All security scan jobs passed or were skipped."
