name: UI E2E run

on:
  workflow_call:
    inputs:
      push-images:
        type: boolean
        default: false
    secrets:
      CLOUD_DISPATCH_APP_ID:
        required: false
      CLOUD_DISPATCH_APP_PRIVATE_KEY:
        required: false
      STRIPE_TEST_SECRET_KEY:
        required: false
      STRIPE_TEST_PRICE_ID:
        required: false
      STRIPE_TEST_PUBLISHABLE_KEY:
        required: false

jobs:
  editions:
    name: editions
    runs-on: ubuntu-latest

    outputs:
      list: ${{ steps.editions.outputs.list }}

    steps:
      - name: Decide which editions can run
        id: editions
        run: |
          if [ "$EVENT" != pull_request ] || [ "$HEAD_REPO" = "$REPO" ]; then
              echo 'list=["community", "enterprise", "cloud"]' >> "$GITHUB_OUTPUT"
          else
              echo 'list=["community"]' >> "$GITHUB_OUTPUT"
              echo "::notice title=enterprise and cloud e2e skipped::a pull request from a fork cannot check out the private cloud source"
          fi
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}

  edition:
    name: e2e (${{ matrix.edition }})
    needs: editions
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.editions.outputs.list) }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: shellhub

      - name: Generate cloud repo token
        id: cloud-token
        if: matrix.edition != 'community'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.CLOUD_DISPATCH_APP_ID }}
          private-key: ${{ secrets.CLOUD_DISPATCH_APP_PRIVATE_KEY }}
          owner: shellhub-io
          repositories: cloud
          permission-contents: read

      - name: Determine cloud branch
        id: cloud-branch
        if: matrix.edition != 'community'
        env:
          GH_TOKEN: ${{ steps.cloud-token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$HEAD_REF" ] && gh api "repos/shellhub-io/cloud/branches/$HEAD_REF" >/dev/null 2>&1; then
            echo "ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out cloud source
        if: matrix.edition != 'community'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: shellhub-io/cloud
          token: ${{ steps.cloud-token.outputs.token }}
          ref: ${{ steps.cloud-branch.outputs.ref }}
          fetch-depth: 1
          path: cloud
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Install Node dependencies
        uses: ./shellhub/.github/actions/ui-deps
        with:
          directory: shellhub/ui

      - name: Generate OpenAPI client
        working-directory: shellhub/ui
        run: |
          npx --no redocly bundle ../openapi/spec/openapi.yaml -o /tmp/openapi.json --force
          OPENAPI_SPEC_PATH=/tmp/openapi.json npm run generate -w @shellhub/console

      - name: Read the Playwright version
        id: playwright-version
        working-directory: shellhub/ui
        run: |
          VERSION=$(jq -r '.packages["node_modules/@playwright/test"].version // empty' package-lock.json)
          [ -n "$VERSION" ] || { echo "could not read the @playwright/test version from package-lock.json"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser
        id: playwright-browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.OS }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        working-directory: shellhub/ui
        run: npm run e2e:browsers -w @shellhub/console

      - name: Save Playwright browser
        if: matrix.edition == 'community' && steps.playwright-browser.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-browser.outputs.cache-primary-key }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: shellhub/tests/go.mod
          cache: false

      - name: Restore the Go caches
        uses: ./shellhub/.github/actions/go-cache
        with:
          name: ui-e2e
          sum-files: shellhub/tests/go.sum

      - name: Set up a BuildKit builder that exports its cache
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Restore the image build cache
        uses: ./shellhub/.github/actions/build-cache

      - name: Log in to the e2e image repository
        continue-on-error: true
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run E2E tests
        working-directory: shellhub/ui
        timeout-minutes: 60
        env:
          E2E_EDITION: ${{ matrix.edition }}
          E2E_STACK_NAME: e2e-${{ matrix.edition }}
          E2E_RUNNER: host
          E2E_KEEP: "1"
          SHELLHUB_E2E_IMAGE_REPOSITORY: ghcr.io/shellhub-io/shellhub-e2e-images
          SHELLHUB_E2E_IMAGE_PUSH: ${{ inputs.push-images }}
          CLOUD_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          CLOUD_STRIPE_PRICE_ID: ${{ secrets.STRIPE_TEST_PRICE_ID }}
          CLOUD_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
        run: |
          if [ "$E2E_EDITION" = cloud ]; then
              export STRIPE_SECRET_KEY=$CLOUD_STRIPE_SECRET_KEY
              export STRIPE_PRICE_ID=$CLOUD_STRIPE_PRICE_ID
              export SHELLHUB_STRIPE_PUBLISHABLE_KEY=$CLOUD_STRIPE_PUBLISHABLE_KEY
          fi
          unset CLOUD_STRIPE_SECRET_KEY CLOUD_STRIPE_PRICE_ID CLOUD_STRIPE_PUBLISHABLE_KEY
          trap 'npm run e2e:down -w @shellhub/console || true' EXIT
          npm run e2e:test -w @shellhub/console

      - name: Save the Go caches
        if: ${{ !cancelled() && matrix.edition == 'community' }}
        uses: ./shellhub/.github/actions/go-cache
        with:
          name: ui-e2e
          sum-files: shellhub/tests/go.sum
          save: true

      - name: Upload Playwright report
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.edition }}
          path: |
            shellhub/ui/apps/console/e2e/tmp
            shellhub/tests/.stack/*.log
          include-hidden-files: true
          retention-days: 14

  e2e:
    name: e2e
    needs: [edition]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Fail unless every edition passed
        if: ${{ needs.edition.result != 'success' }}
        run: exit 1
