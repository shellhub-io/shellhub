name: QA

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.project }}${{ matrix.database && format(' - {0}', matrix.database) || '' }})
    if: ${{ github.event.pull_request.draft == false }}

    strategy:
      fail-fast: false
      matrix:
        project: [server, agent, pkg, gateway]
        database: ['']  # Empty by default
        include:
          # race_args applies to `go test` only: a race-instrumented `go build`
          # would just be discarded, and the detector costs several minutes.
          - project: server
            extra_args: ""
            lint_args: ""
            race_args: "-race"
            test_timeout: "40m"
          - project: gateway
            extra_args: ""
            lint_args: ""
            race_args: "-race"
          - project: agent
            extra_args: "-tags docker"
            lint_args: "--build-tags docker"
            race_args: "-race"
          - project: pkg
            extra_args: ""
            lint_args: ""
            race_args: "-race"
          # Integration tests with PostgreSQL. Each of the ~31 SSH cases stands up
          # its own agent container and runs twice (transport v1 and v2), and the
          # provisioning-key and access-policy cases stand up a stack apiece, so the
          # suite needs well over the 25m the unit-test projects get. The detector
          # is left off here: it would instrument the harness, not the services
          # under test, on an already long job.
          - project: tests
            extra_args: ""
            lint_args: ""
            database: postgres
            test_timeout: "60m"

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # inline YAML or path to separate file (e.g.: .github/filters.yaml)
          filters: |
            go:
              - 'server/**'
              - 'agent/**'
              - 'pkg/**'
              - 'gateway/**'
              - 'tests/**'
              - 'openapi/**'
              - 'docker-compose*.yml'

      - name: Set up Go 1.x [Go]
        if: steps.filter.outputs.go == 'true' && github.event.pull_request.draft == false
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: ${{ matrix.project == 'pkg' && 'go.sum' || format('{0}/go.sum', matrix.project) }}
        id: go

      - name: Get Go dependencies [Go]
        if: steps.filter.outputs.go == 'true' && github.event.pull_request.draft == false
        working-directory: ${{ matrix.project }}
        run: go mod download

      - name: Ensure Go dependencies are complete [Go]
        if: steps.filter.outputs.go == 'true' && github.event.pull_request.draft == false
        working-directory: ${{ matrix.project }}
        run: |
          ../devscripts/prepare-release
          if [ -n "$(git status --porcelain)" ]; then
              echo "Missing dependencies on 'go.mod'"
              exit 1
          fi

      - name: Code format [Go]
        run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi
        if: github.event.pull_request.draft == false

      - name: Code linting [Go]
        if: steps.filter.outputs.go == 'true' && github.event.pull_request.draft == false
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: ${{ matrix.project }}
          version: v2.14.0
          args: --timeout 2m ${{ matrix.lint_args }} ./...
          verify: false

      - name: Set SHELLHUB_DATABASE for integration tests
        if: matrix.project == 'tests' && matrix.database != '' && steps.filter.outputs.go == 'true' && github.event.pull_request.draft == false
        run: |
          # Update .env file with the correct database backend
          sed -i 's/^SHELLHUB_DATABASE=.*/SHELLHUB_DATABASE=${{ matrix.database }}/' .env
          echo "Running integration tests with database: ${{ matrix.database }}"

      - name: Unit test [Go]
        if: steps.filter.outputs.go == 'true' && github.event.pull_request.draft == false
        working-directory: ${{ matrix.project }}
        run: go test ${{ matrix.extra_args }} ${{ matrix.race_args }} -timeout ${{ matrix.test_timeout || '25m' }} ./...
        env:
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: Go build [Go]
        if: matrix.project != 'tests' && steps.filter.outputs.go == 'true' && github.event.pull_request.draft == false
        working-directory: ${{ matrix.project }}
        run: go build -v ${{ matrix.extra_args }} ./...

  mocks:
    name: generated mocks
    if: ${{ github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Ensure generated mocks match the pinned generator
        run: |
          VERSION=$(sed -n 's|.*mockery/v3/\.\.\.@\(v[0-9][0-9.]*\).*|\1|p' server/Dockerfile | head -1)
          if [ -z "$VERSION" ]; then
              echo "could not read the mockery version from server/Dockerfile"
              exit 1
          fi

          go install github.com/vektra/mockery/v3/...@"$VERSION"

          for module in . server agent; do
              (cd "$module" && "$(go env GOPATH)/bin/mockery")
          done

          if [ -n "$(git status --porcelain)" ]; then
              echo "generated mocks do not match mockery $VERSION: run mockery in ., server and agent"
              git --no-pager diff --stat
              exit 1
          fi

  cross-compile:
    name: cross-compile (${{ matrix.goos }})
    if: ${{ github.event.pull_request.draft == false }}

    strategy:
      fail-fast: false
      matrix:
        # Only the GOOS the agent carries platform-specific source for. A target
        # with no _<goos>.go file of its own would be compiling the same code the
        # validate job already builds.
        goos: [freebsd]

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            go:
              - 'agent/**'
              - 'pkg/**'

      - name: Set up Go 1.x [Go]
        if: steps.filter.outputs.go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Get Go dependencies [Go]
        if: steps.filter.outputs.go == 'true'
        working-directory: agent
        run: go mod download

      # The binaries cannot run here, so this is a compile and type check only.
      # It is what catches a build tag drifting out of sync with the interface it
      # implements, which is how the FreeBSD backend went unbuildable unnoticed.
      - name: Go build [Go]
        if: steps.filter.outputs.go == 'true'
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: 0
        run: go build -v ./...

      - name: Go vet [Go]
        if: steps.filter.outputs.go == 'true'
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: 0
        run: go vet ./...
