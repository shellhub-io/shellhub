name: QA

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    if: ${{ github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    env:
      TESTCONTAINERS_RYUK_DISABLED: true

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: &qa-filters |
            go:
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yaml'
              - '.mockery.yaml'
              - 'server/**'
              - 'agent/**'
              - 'pkg/**'
              - 'gateway/**'
              - 'tests/**'
              - 'openapi/**'
              - 'devscripts/prepare-release'
              - 'docker-compose*.yml'
              - 'versions.env'
              - '.github/workflows/qa.yml'
            agent:
              - 'go.mod'
              - 'go.sum'
              - 'agent/**'
              - 'pkg/**'
              - '.github/workflows/qa.yml'

      - name: Set up Go
        if: steps.changes.outputs.go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the Go caches
        if: steps.changes.outputs.go == 'true'
        uses: ./.github/actions/go-cache
        with:
          name: qa-go

      - name: Download the Go modules of every module
        if: steps.changes.outputs.go == 'true'
        run: |
          for module in $(git ls-files '*go.mod' | xargs dirname); do
              (cd "$module" && { go mod download || go mod download; })
          done

      - name: Ensure Go dependencies are complete
        if: steps.changes.outputs.go == 'true'
        run: |
          devscripts/prepare-release
          if [ -n "$(git status --porcelain)" ]; then
              echo "Missing dependencies on 'go.mod'"
              git --no-pager diff --stat
              exit 1
          fi

      - name: Code format
        if: ${{ !cancelled() && steps.changes.outputs.go == 'true' }}
        run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi

      - name: Read the tool versions from versions.env
        if: ${{ !cancelled() && steps.changes.outputs.go == 'true' }}
        id: versions
        run: |
          for name in GOLANGCI_LINT MOCKERY; do
              VERSION=$(sed -n "s/^${name}_VERSION=//p" versions.env)
              if [ -z "$VERSION" ]; then
                  echo "could not read ${name}_VERSION from versions.env"
                  exit 1
              fi
              echo "$(echo "$name" | tr 'A-Z_' 'a-z-')=$VERSION" >> "$GITHUB_OUTPUT"
          done

      - name: Lint pkg
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: pkg
          version: ${{ steps.versions.outputs.golangci-lint }}
          args: --timeout 2m ./...
          verify: false
          skip-cache: true

      - name: Lint server
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: server
          version: ${{ steps.versions.outputs.golangci-lint }}
          args: --timeout 2m ./...
          verify: false
          skip-cache: true

      - name: Lint gateway
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: gateway
          version: ${{ steps.versions.outputs.golangci-lint }}
          args: --timeout 2m ./...
          verify: false
          skip-cache: true

      - name: Lint agent
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: agent
          version: ${{ steps.versions.outputs.golangci-lint }}
          args: --timeout 2m --build-tags docker ./...
          verify: false
          skip-cache: true

      - name: Lint tests
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: tests
          version: ${{ steps.versions.outputs.golangci-lint }}
          args: --timeout 2m ./...
          verify: false
          skip-cache: true

      - name: Ensure generated mocks match the pinned generator
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        env:
          VERSION: ${{ steps.versions.outputs.mockery }}
        run: |
          go install github.com/vektra/mockery/v3/...@"$VERSION"

          for module in . server agent; do
              (cd "$module" && "$(go env GOPATH)/bin/mockery")
          done

          if [ -n "$(git status --porcelain -- . ':!*go.mod' ':!*go.sum')" ]; then
              echo "generated mocks do not match mockery $VERSION: run mockery in ., server and agent"
              git --no-pager diff --stat -- . ':!*go.mod' ':!*go.sum'
              exit 1
          fi

      - name: Test pkg
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        working-directory: pkg
        run: go test -race -timeout 25m ./...

      - name: Test server
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        working-directory: server
        run: go test -race -shuffle=on -timeout 40m ./...

      - name: Test gateway
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        working-directory: gateway
        run: go test -race -timeout 25m ./...

      - name: Test agent
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        working-directory: agent
        run: go test -tags docker -race -timeout 25m ./...

      - name: Build
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        run: |
          (cd pkg && go build ./...)
          (cd server && go build ./...)
          (cd gateway && go build ./...)
          (cd agent && go build -tags docker ./...)

      - name: Build and vet the agent for FreeBSD
        if: ${{ !cancelled() && steps.changes.outputs.agent == 'true' }}
        working-directory: agent
        env:
          GOOS: freebsd
          CGO_ENABLED: 0
        run: |
          go build ./...
          go vet ./...

      - name: Save the Go caches
        if: ${{ !cancelled() && steps.changes.outputs.go == 'true' }}
        uses: ./.github/actions/go-cache
        with:
          name: qa-go
          save: true

  integration:
    name: integration
    if: ${{ github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: shellhub

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          working-directory: shellhub
          filters: *qa-filters

      - name: Decide whether the cloud source can be checked out
        id: cloud-access
        if: >-
          steps.changes.outputs.go == 'true'
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
        run: echo "granted=true" >> "$GITHUB_OUTPUT"

      - name: Report the enterprise and cloud tests skipped for a fork
        if: steps.changes.outputs.go == 'true' && steps.cloud-access.outputs.granted != 'true'
        run: echo "::notice title=enterprise and cloud tests skipped::a pull request from a fork cannot check out the private cloud source"

      - name: Report TestCloudBilling skipped for the Billing workflow
        if: steps.cloud-access.outputs.granted == 'true'
        run: echo "::notice title=TestCloudBilling skipped::the Billing workflow runs it nightly and on cloud pull requests that change billing"

      - name: Generate cloud repo token
        id: cloud-token
        if: steps.cloud-access.outputs.granted == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CLOUD_DISPATCH_APP_ID }}
          private-key: ${{ secrets.CLOUD_DISPATCH_APP_PRIVATE_KEY }}
          owner: shellhub-io
          repositories: cloud
          permission-contents: read

      - name: Determine cloud branch
        id: cloud-branch
        if: steps.cloud-access.outputs.granted == 'true'
        uses: ./shellhub/.github/actions/paired-branch
        with:
          repository: shellhub-io/cloud
          head-ref: ${{ github.head_ref }}
          token: ${{ steps.cloud-token.outputs.token }}

      - name: Check out cloud source
        if: steps.cloud-access.outputs.granted == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: shellhub-io/cloud
          token: ${{ steps.cloud-token.outputs.token }}
          ref: ${{ steps.cloud-branch.outputs.ref }}
          fetch-depth: 1
          path: cloud
          persist-credentials: false

      - name: Restore the Go caches
        if: steps.changes.outputs.go == 'true'
        uses: ./shellhub/.github/actions/go-cache
        with:
          name: qa-integration
          sum-files: shellhub/tests/go.sum

      - name: Restore the image build cache
        if: steps.changes.outputs.go == 'true'
        uses: ./shellhub/.github/actions/build-cache
        with:
          save: true

      - name: Set up the integration tests
        if: steps.changes.outputs.go == 'true'
        uses: ./shellhub/.github/actions/integration-setup

      - name: Run the integration tests
        if: steps.changes.outputs.go == 'true'
        working-directory: shellhub/tests
        run: >-
          gotestsum --format testname --
          -skip '${{ steps.cloud-access.outputs.granted != 'true' && '^(TestEnterprise|TestCloud)' || '^TestCloudBilling$' }}'
          -parallel 8 -timeout 60m ./...
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_TEST_PRICE_ID }}
          SHELLHUB_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}

      - name: Drop the image build cache entries the tests did not use
        if: steps.changes.outputs.go == 'true'
        uses: ./shellhub/.github/actions/build-cache
        with:
          prune: true

      - name: Upload the stack logs of the failed tests
        if: ${{ (failure() || cancelled()) && steps.changes.outputs.go == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-stack-logs
          path: shellhub/tests/.stack/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Save the Go caches
        if: ${{ !cancelled() && steps.changes.outputs.go == 'true' }}
        uses: ./shellhub/.github/actions/go-cache
        with:
          name: qa-integration
          sum-files: shellhub/tests/go.sum
          save: true

  qa:
    name: qa
    needs: [go, integration]
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    steps:
      - name: Fail when a QA job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
