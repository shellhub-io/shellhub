name: QA

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    if: ${{ github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    outputs:
      go: ${{ steps.filter.outputs.go }}
      agent: ${{ steps.filter.outputs.agent }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            go:
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yaml'
              - '.mockery.yaml'
              - 'server/**'
              - 'agent/**'
              - 'pkg/**'
              - 'gateway/**'
              - 'tests/**'
              - 'openapi/**'
              - 'devscripts/prepare-release'
              - 'docker-compose*.yml'
              - '.github/workflows/qa.yml'
            agent:
              - 'go.mod'
              - 'go.sum'
              - 'agent/**'
              - 'pkg/**'
              - '.github/workflows/qa.yml'

  validate:
    name: validate (${{ matrix.project }}${{ matrix.database && format(' - {0}', matrix.database) || '' }})
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        project: [server, agent, pkg, gateway]
        database: ['']  # Empty by default
        include:
          - project: server
            extra_args: ""
            lint_args: ""
            race_args: "-race -shuffle=on"
            test_timeout: "40m"
          - project: gateway
            extra_args: ""
            lint_args: ""
            race_args: "-race"
          - project: agent
            extra_args: "-tags docker"
            lint_args: "--build-tags docker"
            race_args: "-race"
          - project: pkg
            extra_args: ""
            lint_args: ""
            race_args: "-race"
          - project: tests
            extra_args: "-skip ^TestEnterprise"
            lint_args: ""
            database: postgres
            test_timeout: "60m"

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go 1.x [Go]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: ${{ matrix.project == 'pkg' && 'go.sum' || format('{0}/go.sum', matrix.project) }}
        id: go

      - name: Get Go dependencies [Go]
        working-directory: ${{ matrix.project }}
        run: go mod download

      - name: Ensure Go dependencies are complete [Go]
        working-directory: ${{ matrix.project }}
        run: |
          ../devscripts/prepare-release
          if [ -n "$(git status --porcelain)" ]; then
              echo "Missing dependencies on 'go.mod'"
              exit 1
          fi

      - name: Code format [Go]
        run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi

      - name: Code linting [Go]
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: ${{ matrix.project }}
          version: v2.14.0
          args: --timeout 2m ${{ matrix.lint_args }} ./...
          verify: false

      - name: Set SHELLHUB_DATABASE for integration tests
        if: matrix.project == 'tests' && matrix.database != ''
        run: |
          sed -i 's/^SHELLHUB_DATABASE=.*/SHELLHUB_DATABASE=${{ matrix.database }}/' .env
          echo "Running integration tests with database: ${{ matrix.database }}"

      - name: Unit test [Go]
        working-directory: ${{ matrix.project }}
        run: go test ${{ matrix.extra_args }} ${{ matrix.race_args }} -timeout ${{ matrix.test_timeout || '25m' }} ./...
        env:
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: Go build [Go]
        if: matrix.project != 'tests'
        working-directory: ${{ matrix.project }}
        run: go build -v ${{ matrix.extra_args }} ./...

  enterprise-tests:
    name: validate (tests - enterprise)
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: shellhub

      - name: Decide whether the cloud source can be checked out
        id: cloud-access
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "granted=true" >> "$GITHUB_OUTPUT"

      - name: Report the enterprise tests skipped for a fork
        if: steps.cloud-access.outputs.granted != 'true'
        run: echo "::notice title=Enterprise tests skipped::a pull request from a fork cannot check out the private cloud source"

      - name: Generate cloud repo token
        id: cloud-token
        if: steps.cloud-access.outputs.granted == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CLOUD_DISPATCH_APP_ID }}
          private-key: ${{ secrets.CLOUD_DISPATCH_APP_PRIVATE_KEY }}
          owner: shellhub-io
          repositories: cloud
          permission-contents: read

      - name: Determine cloud branch
        id: cloud-branch
        if: steps.cloud-access.outputs.granted == 'true'
        env:
          GH_TOKEN: ${{ steps.cloud-token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$HEAD_REF" ] && gh api "repos/shellhub-io/cloud/branches/$HEAD_REF" >/dev/null 2>&1; then
            echo "ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out cloud source
        if: steps.cloud-access.outputs.granted == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: shellhub-io/cloud
          token: ${{ steps.cloud-token.outputs.token }}
          ref: ${{ steps.cloud-branch.outputs.ref }}
          fetch-depth: 1
          path: cloud
          persist-credentials: false

      - name: Set up Go
        if: steps.cloud-access.outputs.granted == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: shellhub/tests/go.mod
          cache-dependency-path: shellhub/tests/go.sum

      - name: Set SHELLHUB_DATABASE for integration tests
        if: steps.cloud-access.outputs.granted == 'true'
        working-directory: shellhub
        run: sed -i 's/^SHELLHUB_DATABASE=.*/SHELLHUB_DATABASE=postgres/' .env

      - name: Run the enterprise tests
        if: steps.cloud-access.outputs.granted == 'true'
        working-directory: shellhub/tests
        run: go test -run ^TestEnterprise -timeout 60m ./...
        env:
          TESTCONTAINERS_RYUK_DISABLED: true

  mocks:
    name: generated mocks
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Ensure generated mocks match the pinned generator
        run: |
          VERSION=$(sed -n 's|.*mockery/v3/\.\.\.@\(v[0-9][0-9.]*\).*|\1|p' server/Dockerfile | head -1)
          if [ -z "$VERSION" ]; then
              echo "could not read the mockery version from server/Dockerfile"
              exit 1
          fi

          go install github.com/vektra/mockery/v3/...@"$VERSION"

          for module in . server agent; do
              (cd "$module" && "$(go env GOPATH)/bin/mockery")
          done

          if [ -n "$(git status --porcelain)" ]; then
              echo "generated mocks do not match mockery $VERSION: run mockery in ., server and agent"
              git --no-pager diff --stat
              exit 1
          fi

  cross-compile:
    name: cross-compile (${{ matrix.goos }})
    needs: changes
    if: ${{ needs.changes.outputs.agent == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        goos: [freebsd]

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go 1.x [Go]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Get Go dependencies [Go]
        working-directory: agent
        run: go mod download

      - name: Go build [Go]
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: 0
        run: go build -v ./...

      - name: Go vet [Go]
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: 0
        run: go vet ./...

  qa:
    name: qa
    needs: [changes, validate, enterprise-tests, mocks, cross-compile]
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    steps:
      - name: Fail when a QA job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
