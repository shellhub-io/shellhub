name: QA

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]
    types: [assigned, opened, synchronize, reopened, edited, ready_for_review]

jobs:
  validate:
    name: validate (${{ matrix.project }}${{ matrix.database && format(' - {0}', matrix.database) || '' }})
    if: ${{ github.event.pull_request.draft == false }}

    strategy:
      fail-fast: false
      matrix:
        project: [server, agent, pkg, gateway]
        database: ['']  # Empty by default
        include:
          # race_args applies to `go test` only: a race-instrumented `go build`
          # would just be discarded, and the detector costs several minutes.
          #
          # -D revive is the doc-comment rule held back. Every module reads the same
          # .golangci.yaml (the per-module ones are symlinks to it), so revive's
          # `exported` cannot be scoped there; it is scoped here instead, and a module
          # rejoins the rule by dropping its flag once its exported symbols carry a
          # godoc. Remaining: server 605, agent 71.
          - project: server
            extra_args: ""
            lint_args: "-D revive"
            race_args: "-race"
            test_timeout: "40m"
          - project: gateway
            extra_args: ""
            lint_args: ""
            race_args: "-race"
          - project: agent
            extra_args: "-tags docker"
            lint_args: "--build-tags docker -D revive"
            race_args: "-race"
          - project: pkg
            extra_args: ""
            lint_args: ""
            race_args: "-race"
          # Integration tests with PostgreSQL. Each of the ~31 SSH cases stands up
          # its own agent container and runs twice (transport v1 and v2), so the
          # suite needs well over the 25m the unit-test projects get. The detector
          # is left off here: it would instrument the harness, not the services
          # under test, on an already 45-minute job.
          - project: tests
            extra_args: ""
            lint_args: "-D revive"
            database: postgres
            test_timeout: "45m"

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore Docker image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/docker-cache
          key: docker-${{ runner.os }}

      - name: Load cached Docker images
        run: |
          if [ -d /tmp/docker-cache ]; then
            for f in /tmp/docker-cache/*.tar; do
              docker load -i "$f"
            done
          fi

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # inline YAML or path to separate file (e.g.: .github/filters.yaml)
          filters: |
            go:
              - 'server/**'
              - 'agent/**'
              - 'pkg/**'
              - 'gateway/**'
              - 'tests/**'

      - name: Set up Go 1.x [Go]
        if: steps.filter.outputs.go == 'true' && github.event.pull_request.draft == false
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
        id: go

      - name: Get Go dependencies [Go]
        if: steps.filter.outputs.go == 'true' && github.event.pull_request.draft == false
        working-directory: ${{ matrix.project }}
        run: go mod download

      - name: Ensure Go dependencies are complete [Go]
        if: steps.filter.outputs.go == 'true' && github.event.pull_request.draft == false
        working-directory: ${{ matrix.project }}
        run: |
          ../devscripts/prepare-release
          if [ -n "$(git status --porcelain)" ]; then
              echo "Missing dependencies on 'go.mod'"
              exit 1
          fi

      - name: Code format [Go]
        run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi
        if: matrix.os == 'ubuntu-latest' && github.event.pull_request.draft == false

      - name: Code linting [Go]
        if: steps.filter.outputs.go == 'true' && github.event.pull_request.draft == false
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: ${{ matrix.project }}
          version: v2.11.3
          args: --timeout 2m ${{ matrix.lint_args }} ./...
          skip-cache: true

      - name: Set SHELLHUB_DATABASE for integration tests
        if: matrix.project == 'tests' && matrix.database != '' && steps.filter.outputs.go == 'true' && github.event.pull_request.draft == false
        run: |
          # Update .env file with the correct database backend
          sed -i 's/^SHELLHUB_DATABASE=.*/SHELLHUB_DATABASE=${{ matrix.database }}/' .env
          echo "Running integration tests with database: ${{ matrix.database }}"

      - name: Unit test [Go]
        if: steps.filter.outputs.go == 'true' && github.event.pull_request.draft == false
        working-directory: ${{ matrix.project }}
        run: go test ${{ matrix.extra_args }} ${{ matrix.race_args }} -timeout ${{ matrix.test_timeout || '25m' }} ./...
        env:
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: Go build [Go]
        if: matrix.project != 'tests' && steps.filter.outputs.go == 'true' && github.event.pull_request.draft == false
        working-directory: ${{ matrix.project }}
        run: go build -v ${{ matrix.extra_args }} ./...

      - name: Save Docker images to cache
        if: always()
        run: |
          mkdir -p /tmp/docker-cache
          docker images --format '{{.Repository}}:{{.Tag}}' | \
            grep -v '<none>' | while read img; do
              name=$(echo "$img" | tr '/:' '_')
              docker save -o "/tmp/docker-cache/${name}.tar" "$img" 2>/dev/null || true
            done

