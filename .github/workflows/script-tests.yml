name: Script Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04

    outputs:
      is-latest-tag: ${{ steps.filter.outputs.is-latest-tag }}
      gen-config: ${{ steps.filter.outputs.gen-config }}
      comment-scan: ${{ steps.filter.outputs.comment-scan }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            is-latest-tag:
              - '.github/scripts/is-latest-tag.sh'
              - '.github/actions/is-latest-tag/**'
              - 'tests/is-latest-tag_test.sh'
              - '.github/workflows/script-tests.yml'
            gen-config:
              - 'ui/scripts/gen-config.sh'
              - 'tests/ui/**'
              - 'versions.env'
              - '.github/workflows/script-tests.yml'
            comment-scan:
              - 'devscripts/comment-scan'
              - 'tests/devscripts/comment-scan.bats'
              - '.github/workflows/script-tests.yml'

  is-latest-tag:
    name: is-latest-tag
    needs: changes
    if: needs.changes.outputs.is-latest-tag == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run is-latest-tag tests
        run: bash tests/is-latest-tag_test.sh

  gen-config:
    name: gen-config
    needs: changes
    if: needs.changes.outputs.gen-config == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.14.0

      - name: Run gen-config tests
        run: bats tests/ui/gen-config.bats

      - name: Run gen-config tests on busybox
        run: |
          version=$(sed -n 's/^ALPINE_VERSION=//p' versions.env)
          if [ -z "$version" ]; then
            echo "could not read ALPINE_VERSION from versions.env" >&2
            exit 1
          fi
          docker run --rm -v "$PWD:/src" -w /src "alpine:$version" \
            sh -c 'apk add --no-cache bats jq >/dev/null && bats tests/ui/gen-config.bats'

  comment-scan:
    name: comment-scan
    needs: changes
    if: needs.changes.outputs.comment-scan == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.14.0

      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/shellcheck.tar.xz -C /usr/local/bin --strip-components=1 shellcheck-v0.11.0/shellcheck

      - name: Lint comment-scan
        run: shellcheck devscripts/comment-scan

      - name: Run comment-scan tests
        run: bats tests/devscripts/comment-scan.bats

  install-sh:
    name: install.sh
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.14.0

      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/shellcheck.tar.xz -C /usr/local/bin --strip-components=1 shellcheck-v0.11.0/shellcheck

      - name: Lint install.sh
        run: shellcheck -s sh -S warning install.sh

      - name: Run install.sh tests
        run: bats install.bats shellhub-agent-wrapper.bats

      - name: Run install.sh tests on busybox
        run: |
          version=$(sed -n 's/^ALPINE_VERSION=//p' versions.env)
          if [ -z "$version" ]; then
            echo "could not read ALPINE_VERSION from versions.env" >&2
            exit 1
          fi
          docker run --rm -v "$PWD:/src" -w /src "alpine:$version" \
            sh -c 'apk add --no-cache bats >/dev/null && bats install.bats shellhub-agent-wrapper.bats'
