name: UI

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    if: ${{ github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    outputs:
      apps: ${{ steps.apps.outputs.changes }}
      ui: ${{ steps.ui.outputs.ui }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: apps
        with:
          filters: |
            console:
              - 'ui/apps/console/**'
              - 'ui/packages/**'
              - 'ui/package.json'
              - 'ui/package-lock.json'
              - 'ui/eslint.config.js'
              - 'openapi/spec/**'
              - '.github/workflows/validate-ui.yml'
            docs:
              - 'ui/apps/docs/**'
              - 'ui/packages/**'
              - 'ui/package.json'
              - 'ui/package-lock.json'
              - 'ui/eslint.config.js'
              - 'ui/scripts/install-vale.sh'
              - '.github/workflows/validate-ui.yml'
            website:
              - 'ui/apps/website/**'
              - 'ui/packages/**'
              - 'ui/package.json'
              - 'ui/package-lock.json'
              - 'ui/eslint.config.js'
              - '.github/workflows/validate-ui.yml'
            design-system:
              - 'ui/packages/design-system/**'
              - '.github/workflows/validate-ui.yml'

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: ui
        with:
          filters: |
            ui:
              - 'ui/**'
              - 'openapi/spec/**'
              - '.github/workflows/validate-ui.yml'

  validate:
    name: validate (${{ matrix.app }})
    needs: changes
    if: ${{ needs.changes.outputs.apps != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}

    runs-on: ubuntu-latest

    env:
      WORKSPACE: "@shellhub/${{ matrix.app }}"

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js [${{ matrix.app }}]
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"

      - name: Cache node modules [${{ matrix.app }}]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ui/node_modules
          key: ${{ runner.OS }}-ui-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Node Dependencies [${{ matrix.app }}]
        working-directory: ui
        run: npm install

      - name: Generate OpenAPI client [${{ matrix.app }}]
        if: matrix.app == 'console'
        working-directory: ui
        run: |
          npx @redocly/cli@2.31.5 bundle ../openapi/spec/openapi.yaml -o /tmp/openapi.json --force
          OPENAPI_SPEC_PATH=/tmp/openapi.json npm run generate -w "$WORKSPACE"

      - name: Astro sync [${{ matrix.app }}]
        if: matrix.app == 'docs'
        working-directory: ui
        run: npm run sync -w @shellhub/docs

      - name: Unit test [${{ matrix.app }}]
        working-directory: ui
        run: npm run test -w "$WORKSPACE"

      - name: Install Vale [docs]
        if: matrix.app == 'docs'
        run: |
          ./ui/scripts/install-vale.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Code linting [${{ matrix.app }}]
        working-directory: ui
        run: npm run lint -w "$WORKSPACE"

      - name: Build [${{ matrix.app }}]
        if: matrix.app != 'design-system'
        working-directory: ui
        run: npm run build -w "$WORKSPACE"

  unused:
    name: unused files, exports and dependencies
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.JS 24.13.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.0"

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ui/node_modules
          key: ${{ runner.OS }}-ui-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Node Dependencies
        working-directory: ui
        run: npm install

      - name: Generate OpenAPI client
        working-directory: ui
        run: |
          npx @redocly/cli@2.31.5 bundle ../openapi/spec/openapi.yaml -o /tmp/openapi.json --force
          OPENAPI_SPEC_PATH=/tmp/openapi.json npm run generate -w @shellhub/console

      - name: knip
        working-directory: ui
        run: npm run knip

  ui:
    name: ui
    needs: [changes, validate, unused]
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    steps:
      - name: Fail when a UI job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
