name: UI

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    if: ${{ github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    outputs:
      console: ${{ steps.changes.outputs.console }}
      docs: ${{ steps.changes.outputs.docs }}
      website: ${{ steps.changes.outputs.website }}
      design-system: ${{ steps.changes.outputs.design-system }}
      ui: ${{ steps.changes.outputs.ui }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: |
            console:
              - 'ui/apps/console/**'
              - 'ui/packages/**'
              - 'ui/package.json'
              - 'ui/package-lock.json'
              - 'ui/eslint.config.js'
              - 'openapi/spec/**'
              - '.github/workflows/validate-ui.yml'
              - '.github/actions/ui-setup/**'
            docs:
              - 'ui/apps/docs/**'
              - 'ui/packages/**'
              - 'ui/package.json'
              - 'ui/package-lock.json'
              - 'ui/eslint.config.js'
              - 'ui/scripts/install-vale.sh'
              - '.github/workflows/validate-ui.yml'
              - '.github/actions/ui-setup/**'
            website:
              - 'ui/apps/website/**'
              - 'ui/packages/**'
              - 'ui/package.json'
              - 'ui/package-lock.json'
              - 'ui/eslint.config.js'
              - '.github/workflows/validate-ui.yml'
              - '.github/actions/ui-setup/**'
            design-system:
              - 'ui/packages/design-system/**'
              - '.github/workflows/validate-ui.yml'
              - '.github/actions/ui-setup/**'
            ui:
              - 'ui/**'
              - 'openapi/spec/**'
              - '.github/workflows/validate-ui.yml'
              - '.github/actions/ui-setup/**'

  console-test:
    name: console test (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes]
    if: needs.changes.outputs.console == 'true'

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the UI workspace
        uses: ./.github/actions/ui-setup
        with:
          generate-client: true

      - name: Unit test console
        working-directory: ui
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run test -w @shellhub/console -- --shard="$SHARD"

  console-lint:
    name: console lint
    needs: [changes]
    if: needs.changes.outputs.console == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the UI workspace
        uses: ./.github/actions/ui-setup
        with:
          generate-client: true

      - name: Lint console
        working-directory: ui
        run: npm run lint -w @shellhub/console

  console-build:
    name: console build and knip
    needs: [changes]
    if: needs.changes.outputs.ui == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the UI workspace
        uses: ./.github/actions/ui-setup
        with:
          generate-client: true

      - name: Unused files, exports and dependencies
        working-directory: ui
        run: npm run knip

      - name: Build console
        if: ${{ !cancelled() && needs.changes.outputs.console == 'true' }}
        working-directory: ui
        run: npm run build -w @shellhub/console

  docs:
    name: docs
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the UI workspace
        uses: ./.github/actions/ui-setup

      - name: Astro sync docs
        working-directory: ui
        run: npm run sync -w @shellhub/docs

      - name: Install Vale
        run: |
          ./ui/scripts/install-vale.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Unit test docs
        working-directory: ui
        run: npm run test -w @shellhub/docs

      - name: Lint docs
        if: ${{ !cancelled() }}
        working-directory: ui
        run: npm run lint -w @shellhub/docs

      - name: Build docs
        if: ${{ !cancelled() }}
        working-directory: ui
        run: npm run build -w @shellhub/docs

  website:
    name: website
    needs: [changes]
    if: needs.changes.outputs.website == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the UI workspace
        uses: ./.github/actions/ui-setup

      - name: Unit test website
        working-directory: ui
        run: npm run test -w @shellhub/website

      - name: Lint website
        if: ${{ !cancelled() }}
        working-directory: ui
        run: npm run lint -w @shellhub/website

      - name: Build website
        if: ${{ !cancelled() }}
        working-directory: ui
        run: npm run build -w @shellhub/website

  design-system:
    name: design-system
    needs: [changes]
    if: needs.changes.outputs.design-system == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the UI workspace
        uses: ./.github/actions/ui-setup

      - name: Unit test design-system
        working-directory: ui
        run: npm run test -w @shellhub/design-system

      - name: Lint design-system
        if: ${{ !cancelled() }}
        working-directory: ui
        run: npm run lint -w @shellhub/design-system

  ui:
    name: ui
    needs: [changes, console-test, console-lint, console-build, docs, website, design-system]
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    steps:
      - name: Fail when a UI job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
