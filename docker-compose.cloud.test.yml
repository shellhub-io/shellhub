x-e2e-labels: &e2e-labels
  io.shellhub.e2e.run: ${SHELLHUB_E2E_RUN:?}
  io.shellhub.e2e.lease: ${SHELLHUB_E2E_LEASE:-}
  io.shellhub.e2e.kind: ${SHELLHUB_E2E_KIND:-}
  io.shellhub.e2e.expires: ${SHELLHUB_E2E_EXPIRES:-}
  io.shellhub.e2e.checkout: ${SHELLHUB_E2E_CHECKOUT:-}

services:
  server:
    environment:
      - SHELLHUB_DISPOSABLE_EMAIL_DNS_SERVER=stubdns:53
      - SHELLHUB_DISPOSABLE_EMAIL_LIST_URL=http://stubdns:1/
    depends_on:
      - stubdns
  stubdns:
    image: ${DOCKERHUB_MIRROR:-}coredns/coredns:1.11.3
    labels: *e2e-labels
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./tests/stubdns/Corefile:/etc/coredns/Corefile:ro
    networks:
      - shellhub
  stripe-cli:
    labels: *e2e-labels
  mailpit:
    image: ${DOCKERHUB_MIRROR:-}axllent/mailpit:v1.30.7
    labels: *e2e-labels
    ports:
      - ${SHELLHUB_BIND_ADDRESS}:${SHELLHUB_TEST_MAILPIT_PORT:-0}:8025
    networks:
      - shellhub
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 1s
      start_period: 10s
      retries: 20
