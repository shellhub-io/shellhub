x-e2e-labels: &e2e-labels
  io.shellhub.e2e.run: ${SHELLHUB_E2E_RUN:?}
  io.shellhub.e2e.lease: ${SHELLHUB_E2E_LEASE:-}
  io.shellhub.e2e.kind: ${SHELLHUB_E2E_KIND:-}
  io.shellhub.e2e.expires: ${SHELLHUB_E2E_EXPIRES:-}
  io.shellhub.e2e.checkout: ${SHELLHUB_E2E_CHECKOUT:-}

services:
  telemetry-collector:
    image: ${SHELLHUB_TEST_TELEMETRY_COLLECTOR_IMAGE:?}
    labels: *e2e-labels
    environment:
      - ADDRESS=:${SHELLHUB_TEST_TELEMETRY_COLLECTOR_PORT:?}
    networks:
      - shellhub
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${SHELLHUB_TEST_TELEMETRY_COLLECTOR_PORT:?}/healthz"]
      interval: 1s
      retries: 30
  server:
    depends_on:
      telemetry-collector:
        condition: service_healthy
